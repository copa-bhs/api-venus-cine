<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vênus Cine · Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .sidebar-link.active { background: rgba(229,9,20,.12); color: #E50914; border-left: 3px solid #E50914; }
    .sidebar-link:hover:not(.active) { background: rgba(255,255,255,.04); }
    .stat-card { background: linear-gradient(135deg, #141414 0%, #0f0f0f 100%); border: 1px solid #262626; }
    .toast-slide { animation: slideIn .3s ease; }
    @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .input-dark { width: 100%; height: 40px; padding: 0 12px; background: #0a0a0a; border: 1px solid #262626; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .input-dark:focus { border-color: #E50914; }
    .custom-checkbox { width: 20px; height: 20px; accent-color: #22c55e; cursor: pointer; }
    .poster-card { transition: transform 0.2s; }
    .poster-card:hover { transform: scale(1.03); }
</style>
</head>
<body>

<div class="flex min-h-screen">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-60 bg-[#0f0f0f] border-r border-[#262626] flex flex-col fixed lg:static inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform">
        <div class="p-4 border-b border-[#262626]">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black italic text-red-600" style="text-shadow:0 0 12px rgba(229,9,20,.7)">V</span>
                <div>
                    <div class="text-sm font-bold">Vênus Cine</div>
                    <div class="text-[10px] text-gray-500">Painel Admin</div>
                </div>
            </div>
        </div>

        <nav class="flex-1 py-3 overflow-y-auto">
            <a href="#dashboard" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="dashboard"><i class="fa-solid fa-gauge w-4 text-center"></i> Dashboard</a>
            <a href="#provedores" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="provedores"><i class="fa-solid fa-server w-4 text-center"></i> Provedores IPTV</a>
            <a href="#iptv" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="iptv"><i class="fa-solid fa-magnifying-glass w-4 text-center"></i> Importar Conteúdo</a>
            <a href="#filmes" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="filmes"><i class="fa-solid fa-film w-4 text-center"></i> Filmes</a>
            <a href="#series" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="series"><i class="fa-solid fa-tv w-4 text-center"></i> Séries</a>
            <a href="#canais" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="canais"><i class="fa-solid fa-satellite-dish w-4 text-center"></i> Canais</a>
            <div class="my-2 px-4"><div class="h-px bg-[#262626]"></div></div>
            <a href="#clientes" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="clientes"><i class="fa-solid fa-user-tie w-4 text-center"></i> Clientes API</a>
            <a href="#faturamento_admin" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="faturamento_admin"><i class="fa-solid fa-file-invoice-dollar w-4 text-center"></i> Faturamento</a>
            <a href="#proxy" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="proxy"><i class="fa-solid fa-tower-broadcast w-4 text-center"></i> Proxy</a>
        </nav>
    </aside>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="sticky top-0 z-20 bg-[#0a0a0a]/95 backdrop-blur border-b border-[#262626] px-4 py-3 flex items-center gap-3">
            <button onclick="toggleSidebar()" class="lg:hidden w-9 h-9 rounded-lg bg-[#141414] border border-[#262626] flex items-center justify-center">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
            <h1 id="page-title" class="text-lg font-bold flex-1">Dashboard</h1>
            <div class="h-9 px-3 rounded-lg bg-[#141414] border border-[#262626] flex items-center gap-2 text-xs text-green-400">
                <span class="w-2 h-2 rounded-full bg-green-500 pulse"></span> Online
            </div>
        </header>

        <main id="content" class="flex-1 p-4 lg:p-6 overflow-x-hidden"></main>
    </div>
</div>

<div id="toast-root" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
<div id="modal-root"></div>

<script>
const API = '';

const Toast = {
    show(msg, type = 'info', dur = 3000) {
        const colors = { info: 'border-blue-500', success: 'border-green-500', error: 'border-red-500', warn: 'border-yellow-500' };
        const el = document.createElement('div');
        el.className = `toast-slide bg-[#141414] border-l-4 ${colors[type] || colors.info} rounded-lg px-4 py-3 text-sm shadow-2xl min-w-[260px] max-w-[380px] flex items-start gap-3`;
        el.innerHTML = `<div class="flex-1">${msg}</div>`;
        document.getElementById('toast-root').appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, dur);
    }
};

const Api = {
    async get(path) { const r = await fetch(API + path); if (!r.ok) throw new Error(`Erro ${r.status}`); return await r.json(); },
    async post(path, body = null) { const opts = { method: 'POST' }; if (body) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); } const r = await fetch(API + path, opts); if (!r.ok) throw new Error(`Erro ${r.status}`); return await r.json(); },
    async del(path) { const r = await fetch(API + path, { method: 'DELETE' }); if (!r.ok) throw new Error(`Erro ${r.status}`); return await r.json(); },
    
    status() { return this.get('/status'); },
    proxyStats() { return this.get('/proxy/stats'); },
    
    getProvedores() { return this.get('/admin/provedores'); },
    criarProvedor(p) { return this.post('/admin/provedores', p); },
    deletarProvedor(id) { return this.del(`/admin/provedores/${id}`); },
    
    iptvBuscar: (q, tipo, provId) => Api.get(`/admin/iptv/buscar?q=${encodeURIComponent(q)}&tipo=${tipo}&provedor_id=${provId}`),
    iptvImportarLoteBg: (tipo, qtd, provId) => Api.post(`/admin/iptv/importar-lote-bg?tipo=${tipo}&quantidade=${qtd}&provedor_id=${provId}`),
    iptvImportarLoteBgStatus: () => Api.get('/admin/iptv/importar-lote-bg/status'),
    
    adminFilmes: (q='', page=1, size=30) => Api.get(`/admin/filmes?q=${encodeURIComponent(q)}&page=${page}&size=${size}`),
    adminSeries: (q='', page=1, size=30) => Api.get(`/admin/series?q=${encodeURIComponent(q)}&page=${page}&size=${size}`),
    adminCanais: (q='', page=1, size=30) => Api.get(`/admin/canais?q=${encodeURIComponent(q)}&page=${page}&size=${size}`),
    deletarItem: (tipo, id) => Api.del(`/admin/item/${tipo}/${id}`),
    
    wipeAll() { return this.post('/admin/wipe-all'); }
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString('pt-BR');

function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebar-overlay');
    const open = !sb.classList.contains('-translate-x-full');
    if (open) { sb.classList.add('-translate-x-full'); ov.classList.add('hidden'); }
    else { sb.classList.remove('-translate-x-full'); ov.classList.remove('hidden'); }
}

const Router = {
    current: 'dashboard',
    go(route) { window.location.hash = '#' + route; },
    handle() {
        const h = window.location.hash.replace('#', '') || 'dashboard';
        this.current = h;
        document.querySelectorAll('.sidebar-link').forEach(a => { a.classList.toggle('active', a.dataset.route === h); });
        const titles = { dashboard: 'Dashboard', provedores: 'Provedores IPTV', iptv: 'Importar Conteúdo', filmes: 'Filmes', series: 'Séries', canais: 'Canais', clientes: 'Clientes API', faturamento_admin: 'Faturamento', proxy: 'Proxy' };
        document.getElementById('page-title').textContent = titles[h] || h;
        this.render();
        if (window.innerWidth < 1024) { toggleSidebar(); }
    },
    async render() {
        const c = document.getElementById('content');
        c.innerHTML = `<div class="flex justify-center py-20"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-red-600"></i></div>`;
        try {
            if (this.current === 'dashboard') await Views.dashboard(c);
            else if (this.current === 'provedores') await Views.provedores(c);
            else if (this.current === 'iptv') await Views.buscaIptv(c);
            else if (this.current === 'filmes') await Views.list(c, 'filme');
            else if (this.current === 'series') await Views.list(c, 'serie');
            else if (this.current === 'canais') await Views.list(c, 'canal');
            else if (this.current === 'proxy') await Views.proxy(c);
            else c.innerHTML = `<div class="text-center py-20 text-gray-500 font-bold">Em construção</div>`;
        } catch (e) { c.innerHTML = `<div class="text-center py-20 text-red-400 font-bold">Erro: ${esc(e.message)}</div>`; }
    }
};

const Views = {
    async dashboard(c) {
        const s = await Api.status().catch(() => ({}));
        const stats = s.stats || {};
        const proxy = s.proxy || {};
        c.innerHTML = `
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
                ${this.statCard('Filmes', fmt(stats.total_filmes), 'fa-film', 'text-blue-400')}
                ${this.statCard('Séries', fmt(stats.total_series), 'fa-tv', 'text-purple-400')}
                ${this.statCard('Canais', fmt(stats.total_canais), 'fa-satellite-dish', 'text-green-400')}
                ${this.statCard('Proxy (Slugs)', fmt(proxy.slugs_carregados), 'fa-link', 'text-yellow-400')}
            </div>
            <div class="stat-card rounded-xl p-5 border-red-600/30 bg-red-600/5">
                <div class="flex flex-col md:flex-row items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-red-600/20 flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-trash text-red-500 text-xl"></i>
                    </div>
                    <div class="flex-1 text-center md:text-left">
                        <h3 class="text-sm font-bold text-white mb-1">Zona de Perigo</h3>
                        <p class="text-xs text-gray-400">Apaga TODOS os filmes, séries, canais e o banco SQLite. O sistema ficará vazio.</p>
                    </div>
                    <button onclick="Views.wipeAll()" class="h-10 px-4 rounded-lg bg-red-900/50 border border-red-700/50 hover:bg-red-800 text-red-400 hover:text-white text-xs font-bold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bomb"></i> Apagar Catálogo
                    </button>
                </div>
            </div>
        `;
    },

    async wipeAll() {
        if (!confirm('⚠️ ATENÇÃO: Isso vai APAGAR todos os filmes, séries e canais do banco de dados. Tem certeza?')) return;
        try {
            await Api.wipeAll();
            Toast.show('🚨 Limpando catálogo...', 'warn');
            setTimeout(() => Router.render(), 2000);
        } catch (e) { Toast.show('Erro: ' + e.message, 'error'); }
    },

    statCard(label, value, icon, color) {
        return `<div class="stat-card rounded-xl p-4"><div class="flex items-center justify-between mb-2"><div class="text-xs font-semibold text-gray-400 uppercase">${label}</div><i class="fa-solid ${icon} ${color}"></i></div><div class="text-2xl font-black">${value}</div></div>`;
    },

    async provedores(c) {
        const data = await Api.getProvedores();
        const itens = data.items || [];
        c.innerHTML = `
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-black">📡 Provedores</h2>
                <button onclick="Views.criarProvedor()" class="h-10 px-4 rounded-lg bg-red-600 text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i> Novo</button>
            </div>
            ${itens.length === 0 ? `<div class="text-center py-10 text-gray-500">Nenhum provedor.</div>` : `
                <div class="grid md:grid-cols-2 gap-4">
                    ${itens.map(p => `
                        <div class="stat-card rounded-xl p-4">
                            <div class="text-sm font-bold text-red-400">${esc(p.nome)}</div>
                            <div class="text-[10px] text-gray-400 font-mono mb-3">${esc(p.host)}</div>
                            <button onclick="Views.deletarProvedor('${p.id}', '${esc(p.nome)}')" class="w-full h-8 rounded bg-red-600/20 text-red-400 text-[10px] font-bold">Excluir</button>
                        </div>
                    `).join('')}
                </div>
            `}
        `;
    },

    criarProvedor() {
        document.getElementById('modal-root').innerHTML = `
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                <div class="bg-[#141414] rounded-2xl w-full max-w-md border border-[#262626] p-5">
                    <h3 class="font-bold text-sm mb-4">Novo Provedor IPTV</h3>
                    <form onsubmit="Views.salvarProvedor(event)" class="space-y-3">
                        <input name="nome" class="input-dark" placeholder="Nome da Lista" required>
                        <input name="host" class="input-dark font-mono text-xs" placeholder="http://servidor.com:80" required>
                        <input name="username" class="input-dark font-mono text-xs" placeholder="Usuário" required>
                        <input name="password" class="input-dark font-mono text-xs" placeholder="Senha" required>
                        <div class="flex gap-2 pt-2">
                            <button type="button" onclick="document.getElementById('modal-root').innerHTML=''" class="flex-1 h-10 rounded-lg bg-[#1a1a1a] text-xs">Cancelar</button>
                            <button type="submit" class="flex-1 h-10 rounded-lg bg-red-600 text-xs font-bold">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>`;
    },

    async salvarProvedor(ev) {
        ev.preventDefault();
        const form = ev.target;
        try {
            await Api.criarProvedor({ nome: form.nome.value, host: form.host.value, username: form.username.value, password: form.password.value });
            Toast.show('✅ Provedor adicionado!', 'success');
            document.getElementById('modal-root').innerHTML='';
            Router.render();
        } catch (e) { Toast.show(e.message, 'error'); }
    },

    async deletarProvedor(id, nome) {
        if (!confirm(`Excluir ${nome}?`)) return;
        try { await Api.deletarProvedor(id); Router.render(); } catch (e) { Toast.show(e.message, 'error'); }
    },

    async buscaIptv(c) {
        const dataProv = await Api.getProvedores();
        const provedores = dataProv.items || [];
        if (provedores.length === 0) {
            c.innerHTML = `<div class="text-center py-10"><p class="text-gray-400 mb-4">Cadastre um provedor primeiro.</p><button onclick="location.hash='#provedores'" class="h-10 px-6 rounded-lg bg-red-600 text-sm font-bold">Ir para Provedores</button></div>`;
            return;
        }
        const options = provedores.map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('');
        c.innerHTML = `
            <div class="stat-card rounded-xl p-5 mb-6">
                <h3 class="text-sm font-bold mb-3">Importação em Massa</h3>
                <div class="flex flex-wrap gap-2">
                    <select id="imp-provedor" class="input-dark flex-1">${options}</select>
                    <select id="imp-tipo" class="input-dark flex-1"><option value="filme">Filmes</option><option value="serie">Séries</option><option value="canal">Canais</option></select>
                    <select id="imp-qtd" class="input-dark flex-1"><option value="50">50</option><option value="100">100</option><option value="500">500</option><option value="-1">Tudo</option></select>
                    <button onclick="Views.importarBg()" class="h-10 px-4 rounded-lg bg-purple-600 text-xs font-bold">Importar</button>
                </div>
                <div id="imp-logs" class="hidden mt-4 bg-black rounded p-3 h-32 overflow-y-auto text-[10px] text-green-400 font-mono"></div>
            </div>
        `;
    },

    async importarBg() {
        const provId = document.getElementById('imp-provedor').value;
        const tipo = document.getElementById('imp-tipo').value;
        const qtd = parseInt(document.getElementById('imp-qtd').value);
        const box = document.getElementById('imp-logs');
        box.classList.remove('hidden'); box.innerHTML = 'Iniciando...';
        try {
            const r = await Api.iptvImportarLoteBg(tipo, qtd, provId);
            if (!r.ok) throw new Error(r.msg);
            const timer = setInterval(async () => {
                const st = await Api.iptvImportarLoteBgStatus();
                box.innerHTML = st.logs.map(l => `<div>${esc(l)}</div>`).join('');
                box.scrollTop = box.scrollHeight;
                if (!st.ativo) { clearInterval(timer); Toast.show('Concluído!', 'success'); Router.render(); }
            }, 2000);
        } catch(e) { Toast.show(e.message, 'error'); }
    },

    async list(c, tipo) {
        const state = window._listState = window._listState || {}; state[tipo] = state[tipo] || { page: 1, size: 30, q: '' };
        
        const load = async () => {
            const st = state[tipo]; let data;
            if (tipo === 'filme') data = await Api.adminFilmes(st.q, st.page, st.size);
            else if (tipo === 'serie') data = await Api.adminSeries(st.q, st.page, st.size);
            else data = await Api.adminCanais(st.q, st.page, st.size);
            
            const items = data.items || [];
            const total = data.total_items || 0;
            const totalPag = Math.ceil(total / st.size);

            c.innerHTML = `
                <div class="flex flex-wrap gap-2 mb-4">
                    <input id="search-${tipo}" type="text" placeholder="🔍 Buscar título..." value="${esc(st.q)}" class="input-dark flex-1 min-w-[200px]">
                    <button onclick="Views._search('${tipo}')" class="h-10 px-4 rounded-lg bg-red-600 text-xs font-bold"><i class="fa-solid fa-search"></i></button>
                </div>
                <div class="mb-4 text-xs text-gray-500 font-bold">Total: ${fmt(total)} itens</div>
                
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 mb-6">
                    ${items.length === 0 ? '<div class="col-span-full text-center py-10 text-gray-500">Nenhum item encontrado.</div>' : items.map(it => `
                        <div class="poster-card bg-[#0a0a0a] border border-[#262626] rounded-xl overflow-hidden relative group">
                            <div class="aspect-[2/3] bg-[#141414] relative">
                                ${it.capa ? `<img src="${esc(it.capa)}" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display='none'">` : '<div class="flex h-full items-center justify-center text-gray-600 text-xs">Sem capa</div>'}
                                <button onclick="Views.deletar('${tipo}', '${it.iptv_id || it.id}')" class="absolute top-2 right-2 w-8 h-8 rounded-lg bg-red-600/80 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                            <div class="p-2">
                                <div class="text-xs font-bold text-white truncate" title="${esc(it.titulo)}">${esc(it.titulo)}</div>
                                <div class="text-[10px] text-gray-500">${esc(it.ano || '—')}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="flex items-center justify-between text-sm mb-10">
                    <div class="text-gray-500 text-xs">Página ${st.page} de ${totalPag || 1}</div>
                    <div class="flex gap-2">
                        <button ${st.page > 1 ? '' : 'disabled'} onclick="Views._page('${tipo}', ${st.page - 1})" class="h-8 px-4 rounded-lg bg-[#141414] border border-[#262626] text-xs disabled:opacity-30">Anterior</button>
                        <button ${st.page < totalPag ? '' : 'disabled'} onclick="Views._page('${tipo}', ${st.page + 1})" class="h-8 px-4 rounded-lg bg-[#141414] border border-[#262626] text-xs disabled:opacity-30">Próxima</button>
                    </div>
                </div>
            `;
            document.getElementById(`search-${tipo}`).onkeydown = (e) => { if (e.key === 'Enter') Views._search(tipo); };
        };
        await load();
    },

    _search(tipo) { window._listState[tipo].q = document.getElementById(`search-${tipo}`).value; window._listState[tipo].page = 1; Router.render(); },
    _page(tipo, page) { window._listState[tipo].page = page; Router.render(); },
    async deletar(tipo, id) { if (!confirm('Excluir este item?')) return; try { await Api.deletarItem(tipo, id); Router.render(); } catch (e) { Toast.show(e.message, 'error'); } },

    async proxy(c) {
        const p = await Api.proxyStats().catch(() => ({}));
        c.innerHTML = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">${this.statCard('Slugs Ativos', fmt(p.slugs_carregados), 'fa-link', 'text-blue-400')}${this.statCard('Streams Rodando', fmt(p.ativo_total), 'fa-play', 'text-green-400')}${this.statCard('Limite Total', fmt(p.limite_total), 'fa-gauge', 'text-yellow-400')}${this.statCard('IPs Conectados', fmt(p.ips_conectados), 'fa-network-wired', 'text-purple-400')}</div>
        <div class="text-center py-10 text-xs text-gray-500">O proxy reverso está ativo. Ele esconde as credenciais do seu IPTV.</div>`;
    }
};

window.addEventListener('hashchange', () => Router.handle());
window.addEventListener('DOMContentLoaded', () => {
    if (!location.hash) location.hash = '#dashboard';
    else Router.handle();
});
</script>
</body>
</html>
