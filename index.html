<style>
    * { box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }

    .template-btn.active { background: rgba(229,9,20,0.1); border-color: #E50914; color: #E50914; }
    .custom-checkbox { width: 20px; height: 20px; accent-color: #22c55e; cursor: pointer; }
</style>

<body>

<div class="flex min-h-screen">
    <aside id="sidebar" class="w-60 bg-[#0f0f0f] border-r border-[#262626] flex flex-col fixed lg:static inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform">
        <div class="p-4 border-b border-[#262626]">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black italic text-red-600" style="text-shadow:0 0 12px rgba(229,9,20,.7)">V</span>
                <div>
                    <div class="text-sm font-bold">Vênus Cine</div>

        <nav class="flex-1 py-3 overflow-y-auto">
            <a href="#dashboard" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="dashboard"><i class="fa-solid fa-gauge w-4 text-center"></i> Dashboard</a>
            <a href="#clientes" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="clientes"><i class="fa-solid fa-user-tie w-4 text-center"></i> Clientes API</a>
            <a href="#faturamento_admin" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="faturamento_admin"><i class="fa-solid fa-file-invoice-dollar w-4 text-center"></i> Faturamento</a>
            <a href="#pedidos" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="pedidos"><i class="fa-solid fa-inbox w-4 text-center"></i> Pedidos <span id="badge-pedidos" class="ml-auto text-[9px] px-1.5 py-0.5 rounded-full bg-red-600 text-white font-bold hidden">0</span></a>
            <a href="#usuarios" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="usuarios"><i class="fa-solid fa-users w-4 text-center"></i> Usuários App</a>
            <a href="#provedores" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="provedores"><i class="fa-solid fa-server w-4 text-center"></i> Provedores IPTV</a>
            <a href="#iptv" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="iptv"><i class="fa-solid fa-magnifying-glass w-4 text-center"></i> Importar Conteúdo</a>

            <a href="#slider" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="slider"><i class="fa-solid fa-images w-4 text-center"></i> Slider</a>
            <a href="#filmes" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="filmes"><i class="fa-solid fa-film w-4 text-center"></i> Filmes</a>
            <a href="#series" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="series"><i class="fa-solid fa-tv w-4 text-center"></i> Séries</a>
            <a href="#canais" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="canais"><i class="fa-solid fa-satellite-dish w-4 text-center"></i> Canais</a>
            <div class="my-2 px-4"><div class="h-px bg-[#262626]"></div></div>
            <a href="#proxy" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="proxy"><i class="fa-solid fa-tower-broadcast w-4 text-center"></i> Proxy</a>
            <a href="#sistema" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="sistema"><i class="fa-solid fa-server w-4 text-center"></i> Sistema</a>
        </nav>

        <div class="p-4 border-t border-[#262626] space-y-2">
            <div class="flex items-center gap-2 text-[10px]">
                <span class="w-2 h-2 rounded-full bg-gray-600" id="status-dot"></span>
                <span id="status-label" class="text-gray-500">Conectando...</span>
            </div>
            <div class="flex items-center gap-2 text-[10px]">
                <span class="w-2 h-2 rounded-full bg-gray-600" id="ws-dot"></span>
                <span id="ws-label" class="text-gray-500">WS offline</span>
            </div>
        </div>
    </aside>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="sticky top-0 z-20 bg-[#0a0a0a]/95 backdrop-blur border-b border-[#262626] px-4 py-3 flex items-center gap-3">
            <button onclick="toggleSidebar()" class="lg:hidden w-9 h-9 rounded-lg bg-[#141414] border border-[#262626] flex items-center justify-center">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
            <h1 id="page-title" class="text-lg font-bold flex-1">Dashboard</h1>
            <div id="ws-badge" class="h-9 px-3 rounded-lg bg-[#141414] border border-[#262626] flex items-center gap-2 text-xs text-gray-500">
                <span class="w-2 h-2 rounded-full bg-gray-500" id="ws-badge-dot"></span>
                <span id="ws-badge-text">--</span>
            </div>
            <button onclick="manualRefresh()" class="h-9 px-3 rounded-lg bg-[#141414] border border-[#262626] text-xs font-medium flex items-center gap-2 hover:bg-[#1a1a1a]">
                <i class="fa-solid fa-rotate-right"></i> <span class="hidden sm:inline">Atualizar</span>
            </button>
        </header>

        <main id="content" class="flex-1 p-4 lg:p-6 overflow-x-hidden"></main>
    </div>
</div>

<div id="toast-root" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
<div id="modal-root"></div>

<script>
const API = '';
window._pedidoAtual = null;

let WS = null;
let WS_RECONNECT_TIMER = null;

function conectarWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = `${proto}//${location.host}/ws`;
    try { WS = new WebSocket(url); } catch (e) { agendarReconectarWS(); return; }

    WS.onopen = () => { atualizarStatusWS(true); };
    WS.onclose = () => { atualizarStatusWS(false); agendarReconectarWS(); };
    WS.onerror = () => atualizarStatusWS(false);
    WS.onmessage = (ev) => {
        if (ev.data === 'pong') return;
        try {
            const msg = JSON.parse(ev.data);
            tratarEvento(msg.evento, msg.dados);
        } catch {}
    };
    setInterval(() => { if (WS && WS.readyState === WebSocket.OPEN) WS.send('ping'); }, 25000);
}

function agendarReconectarWS() {
    if (WS_RECONNECT_TIMER) clearTimeout(WS_RECONNECT_TIMER);
    WS_RECONNECT_TIMER = setTimeout(conectarWS, 3000);
}

function atualizarStatusWS(online) {
    const dot = document.getElementById('ws-dot');
    const lbl = document.getElementById('ws-label');
    const bd = document.getElementById('ws-badge-dot');
    const bt = document.getElementById('ws-badge-text');
    if (online) {
        dot.className = 'w-2 h-2 rounded-full bg-green-400 pulse';
        lbl.textContent = 'Tempo real ativo';
        bd.className = 'w-2 h-2 rounded-full bg-green-400 pulse';
        bt.textContent = 'AO VIVO';
        bt.className = 'text-green-400 font-bold';
    } else {
        dot.className = 'w-2 h-2 rounded-full bg-red-500';
        lbl.textContent = 'WS offline';
        bd.className = 'w-2 h-2 rounded-full bg-red-500';
        bt.textContent = 'OFFLINE';
        bt.className = 'text-red-400';
    }
}

function tratarEvento(evento, dados) {
    if (evento === 'catalogo_sincronizado') {
        Toast.show(`📡 Catálogo: ${dados.total_filmes} filmes, ${dados.total_series} séries`, 'info', 4000);
        if (['dashboard','filmes','series','canais'].includes(Router.current)) Router.render();
    } else if (evento === 'item_editado') {
        Toast.show(`✏️ ${dados.tipo} "${dados.titulo}" atualizado`, 'success', 3000);
        if (['filmes','series','canais','slider'].includes(Router.current)) Router.render();
    }
}

const Toast = {
    show(msg, type = 'info', dur = 3000) {
        const colors = { info: 'border-blue-500', success: 'border-green-500', error: 'border-red-500', warn: 'border-yellow-500' };
        const icons = { info: 'fa-circle-info', success: 'fa-circle-check', error: 'fa-circle-exclamation', warn: 'fa-triangle-exclamation' };
        const el = document.createElement('div');
        el.className = `toast-slide bg-[#141414] border-l-4 ${colors[type] || colors.info} rounded-lg px-4 py-3 text-sm shadow-2xl min-w-[260px] max-w-[380px] flex items-start gap-3`;
        el.innerHTML = `<i class="fa-solid ${icons[type]} mt-0.5"></i><div class="flex-1">${msg}</div>`;
        document.getElementById('toast-root').appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, dur);
    }
};

const Api = {
    async get(path) {
        const r = await fetch(API + path);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.json();
    },
    async post(path, body = null) {
        const opts = { method: 'POST' };
        if (body) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
        const r = await fetch(API + path, opts);
        if (!r.ok) { const erro = await r.json().catch(() => ({ detail: `HTTP ${r.status}` })); throw new Error(erro.detail || `HTTP ${r.status}`); }
        return await r.json();
    },
    async del(path) {
        const r = await fetch(API + path, { method: 'DELETE' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.json();
    },
    async req(method, path, body) {
        const opts = { method };
        if (body) { opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
        const r = await fetch(API + path, opts);
        if (!r.ok) { const e = await r.json().catch(()=>({detail:`HTTP ${r.status}`})); throw new Error(e.detail || `HTTP ${r.status}`); }
        return r.json();
    },
    status() { return this.get('/status'); },
    proxyStats() { return this.get('/proxy/stats'); },
    
    getProvedores() { return this.get('/admin/provedores'); },
    criarProvedor(p) { return this.post('/admin/provedores', p); },
    deletarProvedor(id) { return this.del(`/admin/provedores/${id}`); },

    adminFilmes: (q='', page=1, size=30) => Api.get(`/admin/filmes?q=${encodeURIComponent(q)}&page=${page}&size=${size}`),
    adminSeries: (q='', page=1, size=30) => Api.get(`/admin/series?q=${encodeURIComponent(q)}&page=${page}&size=${size}`),
    adminCanais: (q='', page=1, size=30) => Api.get(`/admin/canais?q=${encodeURIComponent(q)}&page=${page}&size=${size}`),
    adminItem: (tipo, id) => Api.get(`/admin/item/${tipo}/${id}`),
    deletarItem: (tipo, id) => Api.del(`/admin/item/${tipo}/${id}`),
    notifHistorico() { return this.get('/admin/notificacoes/historico'); },
    notifEnviar(payload) { return this.post('/admin/notificacoes/enviar', payload); },
    pedidos() { return this.get('/admin/notificacoes/pedidos'); },
    concluirPedido(id, payload) { return this.post(`/admin/notificacoes/pedidos/${id}/concluir`, payload); },
    wipeAll() { return this.post('/admin/wipe-all'); },
    forceSyncStatus() { return this.get('/admin/force-sync/status'); },
    iptvBuscar: (q, tipo, provId) => Api.get(`/admin/iptv/buscar?q=${encodeURIComponent(q)}&tipo=${tipo}&provedor_id=${provId}`),
    iptvAdicionar: (payload) => Api.post('/admin/iptv/adicionar', payload),
    iptvAdicionarLote: (items) => Api.post('/admin/iptv/adicionar-lote', { items }),
    iptvImportarLoteBg: (tipo, qtd, provId) => Api.post(`/admin/iptv/importar-lote-bg?tipo=${tipo}&quantidade=${qtd}&provedor_id=${provId}`),
    iptvImportarLoteBgStatus: () => Api.get('/admin/iptv/importar-lote-bg/status'),
    usuarios() { return this.get('/admin/notificacoes/usuarios'); },
    bloquearUsuario(uid, status) { return this.post(`/admin/notificacoes/usuarios/${uid}/bloquear?bloqueado=${status}`); },
    deletarUsuario(uid) { return this.del(`/admin/notificacoes/usuarios/${uid}`); },
    alterarPlano(uid, plano) { return this.post(`/admin/notificacoes/usuarios/${uid}/alterar-plano`, { plano }); },
    
    adminClientes() { return this.get('/admin/clientes'); },
    adminCriarCliente(p) { return this.post('/admin/clientes', p); },
    adminAtualizarCliente(id, p) { return this.req('PUT', `/admin/clientes/${id}`, p); },
    adminDeletarCliente(id) { return this.del(`/admin/clientes/${id}`); },
    adminResetSenha(id, senha) { return this.post(`/admin/clientes/${id}/resetar-senha`, { nova_senha: senha }); },
    adminNovaChave(id) { return this.post(`/admin/clientes/${id}/nova-chave`, { nome: 'admin' }); },
    adminFaturas() { return this.get('/admin/faturas'); },
    adminMarcarPaga(id) { return this.post(`/admin/faturas/${id}/marcar-paga`); }
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString('pt-BR');
const fmtData = (s) => { if (!s) return '—'; try { return new Date(s).toLocaleDateString('pt-BR'); } catch { return s; } };

function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebar-overlay');
    const open = !sb.classList.contains('-translate-x-full');
    if (open) { sb.classList.add('-translate-x-full'); ov.classList.add('hidden'); }
    else { sb.classList.remove('-translate-x-full'); ov.classList.remove('hidden'); }
}

const Router = {
    current: 'dashboard',
    go(route) { window.location.hash = '#' + route; },
    handle() {
        const h = window.location.hash.replace('#', '') || 'dashboard';
        this.current = h;
        document.querySelectorAll('.sidebar-link').forEach(a => { a.classList.toggle('active', a.dataset.route === h); });
        const titles = {
            dashboard: 'Dashboard', clientes: 'Clientes API', faturamento_admin: 'Faturamento (Admin)',
            pedidos: 'Pedidos de Conteúdo', usuarios: 'Usuários App', provedores: 'Provedores IPTV',
            iptv: 'Importar Conteúdo', notificacoes: 'Notificações Push', slider: 'Slider (Hero)',
            filmes: 'Filmes', series: 'Séries', canais: 'Canais', proxy: 'Proxy', sistema: 'Sistema'
        };
        document.getElementById('page-title').textContent = titles[h] || h;
        this.render();
        if (window.innerWidth < 1024) {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        }
    },
    async render() {
        const c = document.getElementById('content');
        c.innerHTML = `<div class="flex items-center justify-center h-64 text-gray-500"><i class="fa-solid fa-circle-notch fa-spin text-2xl"></i></div>`;
        try {
            if (this.current === 'dashboard') await Views.dashboard(c);
            else if (this.current === 'clientes') await Views.clientes(c);
            else if (this.current === 'faturamento_admin') await Views.faturamentoAdmin(c);
            else if (this.current === 'pedidos') await Views.pedidos(c);
            else if (this.current === 'usuarios') await Views.usuarios(c);
            else if (this.current === 'provedores') await Views.provedores(c);
            else if (this.current === 'iptv') await Views.buscaIptv(c);
            else if (this.current === 'notificacoes') await Views.notificacoes(c);
            else if (this.current === 'slider') await Views.slider(c);
            else if (this.current === 'filmes') await Views.list(c, 'filme');
            else if (this.current === 'series') await Views.list(c, 'serie');
            else if (this.current === 'canais') await Views.list(c, 'canal');
            else if (this.current === 'proxy') await Views.proxy(c);
            else if (this.current === 'sistema') await Views.sistema(c);
        } catch (e) { c.innerHTML = `<div class="text-center py-16 text-red-400">Erro: ${esc(e.message)}</div>`; }
    }
};

const Views = {

    async provedores(c) {
        const data = await Api.getProvedores();
        const itens = data.items || [];
        c.innerHTML = `
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-xl font-black">📡 Provedores IPTV</h2>
                    <p class="text-xs text-gray-500 mt-1">Gerencie suas listas de IPTV (Multi-Provedor).</p>
                </div>
                <button onclick="Views.criarProvedor()" class="h-10 px-4 rounded-lg bg-red-600 hover:bg-red-700 text-xs font-bold flex items-center gap-2"><i class="fa-solid fa-plus"></i> Novo Provedor</button>
            </div>
            ${itens.length === 0 ? `
                <div class="stat-card rounded-xl p-12 text-center">
                    <i class="fa-solid fa-server text-5xl text-gray-600 mb-4"></i>
                    <h3 class="text-lg font-bold mb-2">Nenhum provedor ainda</h3>
                    <p class="text-xs text-gray-500 mb-4">Adicione sua primeira lista de IPTV.</p>
                    <button onclick="Views.criarProvedor()" class="h-10 px-6 rounded-lg bg-red-600 text-sm font-bold">Adicionar Provedor</button>
                </div>
            ` : `
                <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${itens.map(p => `
                        <div class="stat-card rounded-xl p-4">
                            <div class="flex items-start justify-between mb-3">
                                <div class="flex-1 min-w-0">
                                    <div class="text-sm font-bold truncate text-red-400">${esc(p.nome)}</div>
                                    <div class="text-[10px] text-gray-400 font-mono truncate">${esc(p.host)}</div>
                                </div>
                                <i class="fa-solid fa-satellite-dish text-blue-400"></i>
                            </div>
                            <div class="text-[10px] text-gray-500 space-y-1 mb-3">
                                <div><i class="fa-solid fa-user mr-1"></i>${esc(p.username)}</div>
                                <div><i class="fa-solid fa-key mr-1"></i>${esc(p.password.substring(0,4))}••••••••</div>
                            </div>
                            <button onclick="Views.deletarProvedor('${p.id}', '${esc(p.nome)}')" class="w-full h-8 rounded bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white text-[10px] font-bold"><i class="fa-solid fa-trash mr-1"></i> Excluir Provedor</button>
                        </div>
                    `).join('')}
                </div>
            `}
        `;
    },

    criarProvedor() {
        document.getElementById('modal-root').innerHTML = `
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 overflow-y-auto" onclick="if(event.target===this)Views.fecharModal()">
                <div class="bg-[#141414] rounded-2xl w-full max-w-md border border-[#262626] my-8">
                    <div class="p-4 border-b border-[#262626] flex items-center justify-between">
                        <div class="font-bold text-sm">Novo Provedor IPTV</div>
                        <button onclick="Views.fecharModal()" class="w-8 h-8 rounded-lg hover:bg-[#222]"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <form onsubmit="Views.salvarProvedor(event)" class="p-5 space-y-3">
                        <div><label class="text-xs text-gray-400 block mb-1">Nome do Provedor *</label><input name="nome" class="input-dark" required placeholder="Ex: Lista Principal"></div>
                        <div><label class="text-xs text-gray-400 block mb-1">URL Host (Xtream) *</label><input name="host" class="input-dark font-mono text-xs" required placeholder="http://servidor.com:80"></div>
                        <div><label class="text-xs text-gray-400 block mb-1">Usuário *</label><input name="username" class="input-dark font-mono text-xs" required></div>
                        <div><label class="text-xs text-gray-400 block mb-1">Senha *</label><input name="password" type="text" class="input-dark font-mono text-xs" required></div>
                        <div class="flex gap-2 pt-2"><button type="button" onclick="Views.fecharModal()" class="flex-1 h-10 rounded-lg bg-[#1a1a1a] border border-[#262626] text-xs">Cancelar</button><button type="submit" class="flex-1 h-10 rounded-lg bg-red-600 text-xs font-bold">Salvar Provedor</button></div>
                    </form>
                </div>
            </div>`;
    },

    async salvarProvedor(ev) {
        ev.preventDefault();
        const form = ev.target;
        try {
            await Api.criarProvedor({
                nome: form.nome.value, host: form.host.value, username: form.username.value, password: form.password.value
            });
            Toast.show('✅ Provedor adicionado!', 'success');
            Views.fecharModal();
            Router.render();
        } catch (e) { Toast.show('Erro: ' + e.message, 'error'); }
    },

    async deletarProvedor(id, nome) {
        if (!confirm(`Excluir o provedor "${nome}"? O conteúdo importado dele não será apagado do catálogo, mas você não poderá mais puxar novos itens.`)) return;
        try {
            await Api.deletarProvedor(id);
            Toast.show('Provedor excluído', 'success');
            Router.render();
        } catch (e) { Toast.show('Erro: ' + e.message, 'error'); }
    },

    async buscaIptv(c) {
        const dataProv = await Api.getProvedores();
        const provedores = dataProv.items || [];

        if (provedores.length === 0) {
            c.innerHTML = `<div class="stat-card rounded-xl p-12 text-center"><i class="fa-solid fa-server text-5xl text-red-500 mb-4"></i><h3 class="text-lg font-bold mb-2">Nenhum provedor cadastrado</h3><p class="text-xs text-gray-500 mb-4">Antes de importar, cadastre um provedor.</p><button onclick="Router.go('provedores')" class="h-10 px-6 rounded-lg bg-red-600 text-sm font-bold">Cadastrar Provedor</button></div>`;
            return;
        }

        const options = provedores.map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('');

        c.innerHTML = `
            <div class="stat-card rounded-xl p-5 mb-6 border-purple-500/30 bg-purple-600/5">
                <div class="text-sm font-bold mb-2"><i class="fa-solid fa-layer-group text-purple-400 mr-2"></i> Importação em Massa</div>
                <div class="flex flex-wrap gap-2 items-end">
                    <div class="flex-1 min-w-[140px]"><label class="text-[10px] text-gray-500 block mb-1">Provedor</label><select id="imp-provedor" class="input-dark">${options}</select></div>
                    <div class="flex-1 min-w-[140px]"><label class="text-[10px] text-gray-500 block mb-1">O que importar?</label><select id="imp-tipo" class="input-dark"><option value="filme">🎬 Filmes</option><option value="serie">📺 Séries</option><option value="canal">📡 Canais</option></select></div>
                    <div class="flex-1 min-w-[100px]"><label class="text-[10px] text-gray-500 block mb-1">Quantidade</label><select id="imp-qtd" class="input-dark"><option value="50">50</option><option value="100">100</option><option value="500">500</option><option value="1000">1000</option><option value="-1">Tudo</option></select></div>
                    <button onclick="Views._importarLoteBg()" id="btn-imp-lote" class="h-10 px-4 rounded-lg bg-purple-600 hover:bg-purple-700 text-xs font-bold"><i class="fa-solid fa-cloud-arrow-down"></i> Importar</button>
                </div>
                <div id="imp-logs-area" class="hidden mt-4 bg-black border border-[#333] rounded-lg p-3 h-48 overflow-y-auto font-mono text-[10px] text-green-400 space-y-1"></div>
            </div>
            <div class="stat-card rounded-xl p-5 mb-6 border-blue-500/30 bg-blue-600/5">
                <div class="text-sm font-bold mb-2"><i class="fa-solid fa-satellite-dish text-blue-400 mr-2"></i> Busca Manual</div>
                <div class="flex flex-wrap gap-2 items-end">
                    <div class="flex-1 min-w-[140px]"><label class="text-[10px] text-gray-500 block mb-1">Provedor</label><select id="busca-provedor" class="input-dark">${options}</select></div>
                    <div class="flex-1 min-w-[100px]"><label class="text-[10px] text-gray-500 block mb-1">Tipo</label><select id="iptv-tipo" class="input-dark"><option value="filme">🎬 Filme</option><option value="serie">📺 Série</option></select></div>
                    <div class="flex-[2] min-w-[220px]"><label class="text-[10px] text-gray-500 block mb-1">Buscar</label><input id="iptv-busca" class="input-dark" placeholder="Digite o nome..."></div>
                    <button onclick="Views._iptvBuscar()" id="btn-iptv-buscar" class="h-10 px-4 rounded-lg bg-blue-600 hover:bg-blue-700 text-xs font-bold"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
                </div>
            </div>
            <div id="iptv-lote-acoes" class="hidden mb-4 flex items-center justify-between bg-[#141414] border border-[#333] p-3 rounded-xl">
                <div class="text-xs font-bold text-gray-300"><span id="lote-count">0</span> selecionados</div>
                <button onclick="Views._iptvAdicionarLote()" class="h-8 px-4 rounded-lg bg-green-600 hover:bg-green-700 text-xs font-bold text-white"><i class="fa-solid fa-plus mr-1"></i> Adicionar</button>
            </div>
            <div id="iptv-resultados" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        `;
        document.getElementById('iptv-busca').onkeydown = (e) => { if (e.key === 'Enter') Views._iptvBuscar(); };
    },

    async _importarLoteBg() {
        const provId = document.getElementById('imp-provedor').value;
        const tipo = document.getElementById('imp-tipo').value;
        const qtd = parseInt(document.getElementById('imp-qtd').value);
        const btn = document.getElementById('btn-imp-lote');
        const box = document.getElementById('imp-logs-area');
        if (!confirm(`Importar ${qtd === -1 ? 'todos' : qtd} ${tipo}(s)?`)) return;
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        box.classList.remove('hidden');
        box.innerHTML = '<div class="text-gray-500">Iniciando...</div>';
        try {
            const r = await Api.iptvImportarLoteBg(tipo, qtd, provId);
            if (!r.ok) throw new Error(r.msg);
            const timer = setInterval(async () => {
                const st = await Api.iptvImportarLoteBgStatus();
                box.innerHTML = st.logs.map(l => `<div>${esc(l)}</div>`).join('');
                box.scrollTop = box.scrollHeight;
                if (!st.ativo) {
                    clearInterval(timer);
                    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> Importar';
                    Toast.show('✅ Concluído!', 'success');
                    pollStatus();
                    Router.render();
                }
            }, 2000);
        } catch (e) {
            Toast.show('Erro: ' + e.message, 'error');
            btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> Importar';
        }
    },

    async _iptvBuscar() {
        const provId = document.getElementById('busca-provedor').value;
        const q = document.getElementById('iptv-busca').value.trim();
        const tipo = document.getElementById('iptv-tipo').value;
        if (!q) return Toast.show('Digite algo', 'warn');
        const btn = document.getElementById('btn-iptv-buscar');
        const box = document.getElementById('iptv-resultados');
        document.getElementById('iptv-lote-acoes').classList.add('hidden');
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        box.innerHTML = `<div class="col-span-full text-center py-10"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-500"></i></div>`;
        try {
            const r = await Api.iptvBuscar(q, tipo, provId);
            const items = r.items || [];
            if (items.length === 0) {
                box.innerHTML = `<div class="col-span-full text-center py-12"><i class="fa-solid fa-triangle-exclamation text-4xl text-yellow-500 mb-3"></i><div class="text-sm text-white">Nada encontrado.</div></div>`;
            } else {
                box.innerHTML = items.map(it => {
                    const badge = it.ja_existe ? `<div class="absolute inset-0 bg-black/60 flex items-center justify-center rounded-xl z-10"><span class="bg-green-600 text-white text-xs font-bold px-3 py-1 rounded-full"><i class="fa-solid fa-check mr-1"></i> Já está</span></div>` : '';
                    const btnAdd = it.ja_existe ? `<button disabled class="w-full h-8 rounded bg-[#222] text-gray-500 text-xs font-bold cursor-not-allowed">Adicionado</button>` : `<button onclick='Views._iptvAdicionar(${JSON.stringify(it)})' class="w-full h-8 rounded bg-green-600/20 text-green-400 hover:bg-green-600 hover:text-white text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i> Adicionar</button>`;
                    const check = it.ja_existe ? `disabled` : `onchange="Views._atualizarLote()"`;
                    return `<div class="stat-card rounded-xl p-3 flex items-center gap-3 relative overflow-hidden">${badge}<input type="checkbox" class="custom-checkbox iptv-check" value='${JSON.stringify(it)}' ${check}><div class="w-16 h-24 rounded bg-gray-900 overflow-hidden flex-shrink-0">${it.capa ? `<img src="${esc(it.capa)}" class="w-full h-full object-cover">` : ''}</div><div class="flex-1 min-w-0"><div class="text-[10px] text-blue-400 font-bold mb-1">ID: ${it.id}</div><div class="text-xs font-bold truncate">${esc(it.titulo)}</div><div class="text-[10px] text-gray-500 mb-2">${it.ano || '—'}</div>${btnAdd}</div></div>`;
                }).join('');
            }
        } catch (e) {
            box.innerHTML = `<div class="col-span-full text-center py-8 text-red-400">Erro: ${esc(e.message)}</div>`;
        }
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Buscar';
    },

    _atualizarLote() {
        const checks = document.querySelectorAll('.iptv-check:checked');
        const box = document.getElementById('iptv-lote-acoes');
        document.getElementById('lote-count').textContent = checks.length;
        if (checks.length > 0) box.classList.remove('hidden'); else box.classList.add('hidden');
    },

    async _iptvAdicionarLote() {
        const checks = document.querySelectorAll('.iptv-check:checked');
        if (checks.length === 0) return;
        const items = Array.from(checks).map(c => JSON.parse(c.value));
        if (!confirm(`Adicionar ${items.length} itens?`)) return;
        try { const r = await Api.iptvAdicionarLote(items); Toast.show(`✅ ${r.adicionados} adicionados!`, 'success'); Views._iptvBuscar(); } catch (e) { Toast.show('Erro: ' + e.message, 'error'); }
    },

    async _iptvAdicionar(item) {
        if (!confirm(`Adicionar "${item.titulo}"?`)) return;
        try { const r = await Api.iptvAdicionar(item); if (!r.ok) throw new Error(r.msg); Toast.show('✅ Adicionado!', 'success'); Views._iptvBuscar(); } catch (e) { Toast.show('Erro: ' + e.message, 'error'); }
    },

    // (As demais views como dashboard, clientes, faturamentoAdmin, pedidos, usuarios, notificacoes, 
    // slider, list, proxy e sistema permanecem exatamente iguais ao código anterior)

    async dashboard(c) { /* ... código do dashboard ... */ },
    async clientes(c) { /* ... código de clientes ... */ },
    async faturamentoAdmin(c) { /* ... código do faturamento ... */ },
    async pedidos(c) { /* ... */ },
    async usuarios(c) { /* ... */ },
    async notificacoes(c) { /* ... */ },
    async slider(c) { /* ... */ },
    async list(c, tipo) { /* ... */ },
    async proxy(c) { /* ... */ },
    async sistema(c) { /* ... */ },

    fecharModal() { document.getElementById('modal-root').innerHTML = ''; },
    statCard(label, value, icon, color) {
        return `<div class="stat-card rounded-xl p-4"><div class="flex items-center justify-between mb-2"><div class="text-xs font-semibold text-gray-400 uppercase">${label}</div><i class="fa-solid ${icon} ${color}"></i></div><div class="text-2xl font-black">${value}</div></div>`;
    }
};
</script>
</body>
</html>
