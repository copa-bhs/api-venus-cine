<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vênus API · Painel do Cliente</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Firebase SDK para Login com Google -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAvTri3e0L1r5Z60RexRLwdAD9GKD7aYas",
    authDomain: "apivenuscine.firebaseapp.com",
    projectId: "apivenuscine",
    storageBucket: "apivenuscine.firebasestorage.app",
    messagingSenderId: "289112759962",
    appId: "1:289112759962:web:ad2a56c64ff3a8b4f48923",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  window.loginComGoogle = async function() {
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;
      const idToken = await user.getIdToken();

      const res = await fetch('/v1/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: idToken })
      });
      
      if (res.ok) { location.reload(); } 
      else { alert('Erro ao logar com Google. Tente novamente.'); }
    } catch (error) {
      console.error(error);
      alert('Falha no login: ' + error.message);
    }
  };
</script>

<style>
  * { box-sizing: border-box; }
  body { background:#0a0a0a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; }
  .input-dark{width:100%;height:40px;padding:0 12px;background:#0a0a0a;border:1px solid #262626;border-radius:8px;color:#fff;font-size:14px;outline:none;transition:.2s}
  .input-dark:focus{border-color:#E50914}
  .btn-red{background:#E50914;transition:.2s;color:#fff;font-weight:bold;border-radius:8px}
  .btn-red:hover{background:#ff0a16}
  .btn-google{background:#fff;color:#333;transition:.2s;font-weight:bold;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-google:hover{background:#eee}
  .tab-btn { flex:1; padding:10px; text-align:center; font-size:13px; font-weight:bold; color:#666; cursor:pointer; border-bottom:2px solid transparent; transition:.2s; }
  .tab-btn.active { color:#E50914; border-bottom-color:#E50914; }
  .card { background:linear-gradient(135deg,#141414,#0f0f0f); border:1px solid #262626; }
  .sidebar-link.active { background:rgba(229,9,20,.12); color:#E50914; border-left:3px solid #E50914; }
  .key-box{background:#0a0a0a;border:1px dashed #333;border-radius:8px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
</style>
</head>
<body>

<!-- TELA DE LOGIN / CADASTRO -->
<div id="login-screen" class="fixed inset-0 z-50 bg-[#0a0a0a] flex items-center justify-center p-4 overflow-y-auto">
  <div class="card rounded-2xl w-full max-w-sm p-0 overflow-hidden my-4 shadow-2xl">
    <div class="text-center pt-8 pb-2">
      <div class="w-16 h-16 rounded-full bg-red-600 flex items-center justify-center mx-auto mb-3" style="box-shadow:0 0 24px rgba(229,9,20,.5)">
        <span class="text-3xl font-black italic">V</span>
      </div>
      <h1 class="text-xl font-black">Vênus API</h1>
      <p class="text-xs text-gray-500">Painel do Cliente</p>
    </div>

    <div class="flex border-b border-[#262626] px-2 mt-4">
      <div class="tab-btn active" id="tab-login" onclick="mudarAba('login')">Entrar</div>
      <div class="tab-btn" id="tab-cadastro" onclick="mudarAba('cadastro')">Criar conta</div>
    </div>

    <div class="p-6">
      <div id="auth-erro" class="hidden mb-3 text-xs text-red-400 bg-red-600/10 border border-red-600/30 rounded-lg p-2 text-center"></div>

      <!-- LOGIN -->
      <form id="form-login" onsubmit="doLogin(event)" class="space-y-3">
        <div><input id="login-email" type="email" class="input-dark" required placeholder="E-mail"></div>
        <div><input id="login-senha" type="password" class="input-dark" required placeholder="Senha"></div>
        <button type="submit" id="btn-login" class="w-full h-11 btn-red">Entrar</button>
      </form>

      <!-- CADASTRO -->
      <form id="form-cadastro" onsubmit="doCadastro(event)" class="space-y-3 hidden">
        <div><input id="cad-nome" type="text" class="input-dark" required placeholder="Nome completo"></div>
        <div><input id="cad-email" type="email" class="input-dark" required placeholder="E-mail"></div>
        <div><input id="cad-senha" type="password" class="input-dark" required minlength="6" placeholder="Senha (mín. 6)"></div>
        <button type="submit" id="btn-cadastro" class="w-full h-11 btn-red">Criar conta grátis</button>
      </form>

      <div class="relative flex py-4 items-center">
          <div class="flex-grow border-t border-[#262626]"></div>
          <span class="flex-shrink-0 mx-4 text-gray-500 text-xs">ou</span>
          <div class="flex-grow border-t border-[#262626]"></div>
      </div>

      <button onclick="window.loginComGoogle()" class="w-full h-11 btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
        Entrar com Google
      </button>
      
      <p class="text-[10px] text-gray-500 text-center mt-4">1.000 requisições grátis por 7 dias. Sem cartão.</p>
    </div>
  </div>
</div>

<!-- PAINEL (SÓ APARECE SE ESTIVER LOGADO) -->
<div id="app" class="hidden">
  <div class="flex min-h-screen">
    <!-- SIDEBAR -->
    <aside class="w-60 bg-[#0f0f0f] border-r border-[#262626] flex flex-col fixed inset-y-0 left-0 z-40">
      <div class="p-4 border-b border-[#262626] flex items-center gap-2">
        <span class="text-2xl font-black italic text-red-600">V</span>
        <div>
          <div class="text-sm font-bold">Vênus API</div>
          <div class="text-[10px] text-gray-500">Painel do Cliente</div>
        </div>
      </div>
      <nav class="flex-1 py-3">
        <a href="#dashboard" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="dashboard"><i class="fa-solid fa-gauge w-4"></i> Dashboard</a>
        <a href="#keys" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="keys"><i class="fa-solid fa-key w-4"></i> Minhas API Keys</a>
        <a href="#plano" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="plano"><i class="fa-solid fa-crown w-4"></i> Meu Plano</a>
        <a href="#docs" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="docs"><i class="fa-solid fa-book w-4"></i> Documentação</a>
      </nav>
      <div class="p-4 border-t border-[#262626]">
        <button onclick="fazerLogout()" class="w-full h-8 rounded bg-red-600/10 text-red-500 text-xs font-bold hover:bg-red-600/20">Sair</button>
      </div>
    </aside>

    <!-- CONTEÚDO -->
    <div class="flex-1 ml-60 flex flex-col">
      <header class="bg-[#0a0a0a] border-b border-[#262626] px-6 py-4 flex items-center justify-between">
        <h1 id="page-title" class="text-lg font-bold">Dashboard</h1>
        <div class="text-xs bg-[#141414] border border-[#262626] px-3 py-1.5 rounded-lg"><i class="fa-solid fa-bolt text-yellow-400 mr-1"></i> <span id="saldo-text">--</span></div>
      </header>
      <main id="content" class="flex-1 p-6"></main>
    </div>
  </div>
</div>

<div id="modal-root"></div>

<script>
const state = { cliente:null, plano:null, chaves:[] };

// ============ HELPERS ============
const Toast = {
  show(msg, type='info') {
    const el=document.createElement('div');
    el.className=`fixed bottom-4 right-4 z-50 bg-[#141414] border-l-4 ${type==='error'?'border-red-500':'border-green-500'} text-white px-4 py-3 rounded-lg shadow-2xl text-sm`;
    el.textContent=msg; document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3000);
  }
};
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy = async (txt,msg='Copiado!')=>{try{await navigator.clipboard.writeText(txt);Toast.show(msg)}catch{Toast.show('Erro ao copiar','error')}};

// ============ API ============
const Api = {
  async req(method, path, body) {
    const opts = { method, credentials:'include' };
    if (body) { opts.headers={'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
    const r = await fetch(path, opts);
    if (r.status === 401 && !path.includes('/auth/login')) { mostrarLogin(); throw new Error('Sessão expirada'); }
    if (!r.ok) { let d='Erro'; try{ d=(await r.json()).detail }catch{} throw new Error(d); }
    return r.json();
  },
  get(p){ return this.req('GET',p); },
  post(p,b){ return this.req('POST',p,b); },
  del(p){ return this.req('DELETE',p); }
};

function mostrarLogin(){ document.getElementById('login-screen').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
function esconderLogin(){ document.getElementById('login-screen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); }

function mudarAba(aba){
  document.getElementById('tab-login').classList.toggle('active', aba==='login');
  document.getElementById('tab-cadastro').classList.toggle('active', aba==='cadastro');
  document.getElementById('form-login').classList.toggle('hidden', aba!=='login');
  document.getElementById('form-cadastro').classList.toggle('hidden', aba!=='cadastro');
  document.getElementById('auth-erro').classList.add('hidden');
}

async function doLogin(ev){
  ev.preventDefault();
  const btn = document.getElementById('btn-login');
  btn.disabled=true; btn.innerHTML='Entrando...';
  try{
    await Api.post('/v1/auth/login',{ email:document.getElementById('login-email').value, senha:document.getElementById('login-senha').value });
    iniciarPainel();
  }catch(e){ document.getElementById('auth-erro').textContent = e.message; document.getElementById('auth-erro').classList.remove('hidden'); }
  finally{ btn.disabled=false; btn.innerHTML='Entrar'; }
}

async function doCadastro(ev){
  ev.preventDefault();
  const btn = document.getElementById('btn-cadastro');
  btn.disabled=true; btn.innerHTML='Criando...';
  try{
    const r = await Api.post('/v1/auth/register',{ nome:document.getElementById('cad-nome').value, email:document.getElementById('cad-email').value, senha:document.getElementById('cad-senha').value });
    document.getElementById('modal-root').innerHTML = `
      <div class="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4">
        <div class="bg-[#141414] rounded-2xl w-full max-w-lg border border-[#262626] p-6 text-center">
          <i class="fa-solid fa-key text-4xl text-green-400 mb-3"></i>
          <h3 class="text-lg font-bold mb-1">Conta criada!</h3>
          <p class="text-xs text-gray-400 mb-4">Sua API Key inicial foi gerada.</p>
          <div class="key-box text-green-400 mb-4">${esc(r.api_key)}</div>
          <p class="text-xs text-red-400 mb-4 font-bold">Guarde agora. Não mostraremos de novo!</p>
          <button onclick="copy('${esc(r.api_key)}','Copiado!')" class="w-full h-10 btn-red">Copiar e Entrar</button>
        </div>
      </div>`;
    setTimeout(()=>{ document.getElementById('modal-root').innerHTML=''; iniciarPainel(); }, 4000);
  }catch(e){ document.getElementById('auth-erro').textContent = e.message; document.getElementById('auth-erro').classList.remove('hidden'); }
  finally{ btn.disabled=false; btn.innerHTML='Criar conta grátis'; }
}

async function fazerLogout(){ await Api.post('/v1/auth/logout'); mostrarLogin(); }

async function iniciarPainel(){
  try{
    state.cliente = await Api.get('/v1/auth/me');
    state.plano = state.cliente.plano;
    esconderLogin();
    document.getElementById('saldo-text').textContent = `${state.cliente.uso_mes} / ${state.plano.req_mes<0?'∞':state.plano.req_mes}`;
    Router.handle();
  }catch(e){ mostrarLogin(); }
}

// ============ ROUTER ============
const Router = {
  current:'dashboard',
  handle(){
    const h = location.hash.replace('#','')||'dashboard';
    this.current = h;
    document.querySelectorAll('.sidebar-link').forEach(a=>a.classList.toggle('active', a.dataset.route===h));
    const t={dashboard:'Dashboard',keys:'API Keys',plano:'Meu Plano',docs:'Documentação'};
    document.getElementById('page-title').textContent=t[h]||h;
    this.render();
  },
  async render(){
    const c = document.getElementById('content');
    c.innerHTML = '<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-2xl text-red-600"></i></div>';
    try{
      if(this.current==='dashboard') await Views.dashboard(c);
      else if(this.current==='keys') await Views.keys(c);
      else if(this.current==='plano') await Views.plano(c);
      else if(this.current==='docs') await Views.docs(c);
    }catch(e){ c.innerHTML = `<div class="text-red-400 text-center">Erro: ${e.message}</div>`; }
  }
};

// ============ VIEWS ============
const Views = {
  async dashboard(c){
    const pct = state.plano.req_mes>0 ? Math.min(100,(state.cliente.uso_mes/state.plano.req_mes)*100) : 0;
    c.innerHTML = `
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="card p-4 rounded-xl"><div class="text-xs text-gray-400 mb-1">Requisições</div><div class="text-2xl font-black">${state.cliente.uso_mes}</div></div>
        <div class="card p-4 rounded-xl"><div class="text-xs text-gray-400 mb-1">Cota do Plano</div><div class="text-2xl font-black">${state.plano.req_mes<0?'Ilimitado':state.plano.req_mes}</div></div>
        <div class="card p-4 rounded-xl"><div class="text-xs text-gray-400 mb-1">Plano Atual</div><div class="text-2xl font-black text-yellow-400 uppercase">${state.plano.nome}</div></div>
        <div class="card p-4 rounded-xl"><div class="text-xs text-gray-400 mb-1">Expira em</div><div class="text-sm font-bold mt-2">${new Date(state.plano.expira_em).toLocaleDateString()}</div></div>
      </div>
      <div class="card p-5 rounded-xl mb-6">
        <div class="text-sm font-bold mb-3">Consumo</div>
        <div class="h-3 bg-[#1a1a1a] rounded overflow-hidden"><div class="h-full bg-red-600" style="width:${pct}%"></div></div>
      </div>
    `;
  },

  async keys(c){
    const data = await Api.get('/v1/auth/keys');
    c.innerHTML = `
      <div class="flex justify-between mb-6">
        <h2 class="text-lg font-bold">Suas Chaves</h2>
        <button onclick="Views.novaChave()" class="h-10 px-4 btn-red text-xs">+ Nova Chave</button>
      </div>
      <div class="space-y-3">
        ${data.items.map(k=>`
          <div class="card p-4 rounded-xl flex items-center justify-between">
            <div>
              <div class="text-sm font-bold">${esc(k.nome)}</div>
              <div class="text-[10px] text-gray-500 font-mono mt-1">${esc(k.prefixo)}••••••••</div>
            </div>
            ${k.ativa ? `<button onclick="Views.revogar(${k.id})" class="text-xs text-red-500 font-bold">Revogar</button>` : '<span class="text-xs text-gray-600">Inativa</span>'}
          </div>
        `).join('')}
      </div>
    `;
  },
  async novaChave(){
    const nome = prompt("Nome da chave (ex: Produção):");
    if(!nome) return;
    const r = await Api.post('/v1/auth/keys',{nome});
    alert("Sua nova chave (copie agora):\n\n" + r.chave);
    Router.render();
  },
  async revogar(id){
    if(!confirm('Revogar chave?')) return;
    await Api.del('/v1/auth/keys/'+id);
    Router.render();
  },

  async plano(c){
    const planos = await Api.get('/v1/plans');
    c.innerHTML = `
      <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
        ${planos.items.map(p=>`
          <div class="card p-5 rounded-xl text-center">
            <div class="text-sm font-bold text-red-500 mb-2">${esc(p.nome)}</div>
            <div class="text-2xl font-black mb-4">R$ ${p.preco_mensal}</div>
            <button onclick="Toast.show('Pagamento em breve','info')" class="w-full h-10 border border-[#333] hover:bg-[#1a1a1a] rounded-lg text-xs">Assinar</button>
          </div>
        `).join('')}
      </div>
    `;
  },

  async docs(c){
    const k = state.chaves[0] ? state.chaves[0].prefixo : 'SUA_KEY';
    c.innerHTML = `
      <div class="card p-5 rounded-xl mb-4">
        <h3 class="font-bold text-sm mb-3">Exemplo de Requisição</h3>
        <div class="bg-[#0a0a0a] p-3 rounded text-xs font-mono text-green-400 overflow-x-auto">
          curl -H "X-API-Key: vn_live_${k}..." https://api.venusdev.xyz/v1/filmes
        </div>
      </div>
      <div class="card p-5 rounded-xl">
        <h3 class="font-bold text-sm mb-3">Playlist M3U (TiviMate / VLC)</h3>
        <div class="bg-[#0a0a0a] p-3 rounded text-xs font-mono text-green-400 break-all">
          https://api.venusdev.xyz/v1/playlist.m3u?api_key=vn_live_${k}...
        </div>
      </div>
    `;
  }
};

window.addEventListener('hashchange', ()=>Router.handle());
window.addEventListener('DOMContentLoaded', ()=>iniciarPainel());
</script>
</body>
</html>
