<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vênus API · Painel do Cliente</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAvTri3e0L1r5Z60RexRLwdAD9GKD7aYas",
    authDomain: "apivenuscine.firebaseapp.com",
    projectId: "apivenuscine",
    storageBucket: "apivenuscine.firebasestorage.app",
    messagingSenderId: "289112759962",
    appId: "1:289112759962:web:ad2a56c64ff3a8b4f48923",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  window.loginComGoogle = async function() {
    try {
      await signInWithRedirect(auth, provider);
    } catch (error) {
      alert('Erro ao iniciar login: ' + error.message);
    }
  };

  window.verificarRetornoGoogle = async function() {
    try {
      const result = await getRedirectResult(auth);
      if (result && result.user) {
        document.getElementById('view-inicial').innerHTML = '<div class="text-center"><i class="fa-solid fa-spinner fa-spin text-4xl text-red-600"></i><p class="mt-4 text-gray-400">Entrando...</p></div>';
        
        const idToken = await result.user.getIdToken();
        const res = await fetch('/v1/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken: idToken })
        });
        
        if (res.ok) { 
          location.reload(); 
        } else { 
          const erro = await res.json();
          alert('Erro no servidor: ' + erro.detail); 
          location.reload(); 
        }
      }
    } catch (error) {
      console.error("Erro no retorno do Google:", error);
    }
  };
</script>

<style>
  * { box-sizing: border-box; }
  body { background:#0a0a0a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; }
  .input-dark{width:100%;height:48px;padding:0 16px;background:#141414;border:1px solid #333;border-radius:12px;color:#fff;font-size:14px;outline:none;transition:.2s}
  .input-dark:focus{border-color:#E50914;background:#1a1a1a}
  .btn-red{background:#E50914;transition:.2s;color:#fff;font-weight:bold;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-red:hover{background:#ff0a16}
  .btn-google{background:#fff;color:#111;transition:.2s;font-weight:bold;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn-google:hover{background:#eee}
  .card { background:#0f0f0f; border:1px solid #262626; border-radius:20px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  .sidebar-link.active { background:rgba(229,9,20,.12); color:#E50914; border-left:3px solid #E50914; }
  .key-box{background:#0a0a0a;border:1px dashed #444;border-radius:12px;padding:12px;font-family:ui-monospace,monospace;font-size:14px;word-break:break-all;text-align:center}
</style>
</head>
<body>

<!-- TELA DE ENTRADA (INICIAL) -->
<div id="view-inicial" class="fixed inset-0 z-50 bg-[#0a0a0a] flex items-center justify-center p-4">
  <div class="card w-full max-w-sm p-8 text-center relative overflow-hidden">
    <div class="absolute -top-20 -right-20 w-40 h-40 bg-red-600 rounded-full blur-[80px] opacity-20"></div>

    <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-red-500 to-red-800 flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(229,9,20,0.3)]">
      <span class="text-4xl font-black italic text-white drop-shadow-lg">V</span>
    </div>
    
    <h1 class="text-2xl font-black mb-2 tracking-tight">Vênus API</h1>
    <p class="text-sm text-gray-400 mb-8">O poder do streaming na sua mão.</p>

    <div class="space-y-3">
      <button onclick="window.loginComGoogle()" class="w-full h-12 btn-google text-sm">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
        Entrar com Google
      </button>
      
      <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-[#333]"></div>
          <span class="flex-shrink-0 mx-4 text-gray-600 text-xs font-bold">OU</span>
          <div class="flex-grow border-t border-[#333]"></div>
      </div>

      <button onclick="mostrarCadastro()" class="w-full h-12 btn-red text-sm">
        <i class="fa-solid fa-envelope"></i> Criar conta com E-mail
      </button>
    </div>
    
    <p class="text-[11px] text-gray-500 mt-6">1.000 requisições grátis por 7 dias.<br>Não precisa de cartão de crédito.</p>
  </div>
</div>

<!-- TELA DE CADASTRO / LOGIN EMAIL -->
<div id="view-cadastro" class="hidden fixed inset-0 z-50 bg-[#0a0a0a] flex items-center justify-center p-4">
  <div class="card w-full max-w-sm p-6 relative">
    <button onclick="mostrarInicial()" class="absolute top-4 left-4 w-8 h-8 rounded-full bg-[#1a1a1a] flex items-center justify-center text-gray-400 hover:text-white transition">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    
    <div class="text-center mt-4 mb-6">
      <h2 id="title-form" class="text-xl font-black">Criar Conta</h2>
      <p class="text-xs text-gray-500 mt-1">Preencha seus dados abaixo</p>
    </div>

    <div id="auth-erro" class="hidden mb-4 text-xs text-red-400 bg-red-600/10 border border-red-600/30 rounded-lg p-2 text-center"></div>

    <form id="form-cadastro" onsubmit="doCadastro(event)" class="space-y-3">
      <div><input id="cad-nome" type="text" class="input-dark" required placeholder="Nome completo"></div>
      <div><input id="cad-email" type="email" class="input-dark" required placeholder="E-mail"></div>
      <div><input id="cad-senha" type="password" class="input-dark" required minlength="6" placeholder="Senha (mín. 6 caracteres)"></div>
      <button type="submit" id="btn-cadastro" class="w-full h-12 btn-red mt-4">Criar minha conta</button>
    </form>

    <form id="form-login" onsubmit="doLogin(event)" class="space-y-3 hidden">
      <div><input id="login-email" type="email" class="input-dark" required placeholder="E-mail"></div>
      <div><input id="login-senha" type="password" class="input-dark" required placeholder="Senha"></div>
      <button type="submit" id="btn-login" class="w-full h-12 btn-red mt-4">Entrar na conta</button>
    </form>

    <div class="text-center mt-6">
      <button onclick="alternarForm()" id="btn-alternar" class="text-xs text-gray-400 hover:text-white transition">Já tem uma conta? <span class="text-red-500 font-bold">Faça login</span></button>
    </div>
  </div>
</div>

<!-- PAINEL -->
<div id="app" class="hidden">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-[#0f0f0f] border-r border-[#262626] flex flex-col fixed inset-y-0 left-0 z-40">
      <div class="p-6 border-b border-[#262626] flex items-center gap-3">
        <span class="text-3xl font-black italic text-red-600 drop-shadow-[0_0_10px_rgba(229,9,20,0.5)]">V</span>
        <div>
          <div class="text-sm font-bold text-white">Vênus API</div>
          <div class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Dashboard</div>
        </div>
      </div>
      <nav class="flex-1 py-6 space-y-1">
        <a href="#dashboard" class="sidebar-link flex items-center gap-4 px-6 py-3 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="dashboard"><i class="fa-solid fa-chart-pie w-5"></i> Visão Geral</a>
        <a href="#keys" class="sidebar-link flex items-center gap-4 px-6 py-3 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="keys"><i class="fa-solid fa-key w-5"></i> Minhas API Keys</a>
        <a href="#plano" class="sidebar-link flex items-center gap-4 px-6 py-3 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="plano"><i class="fa-solid fa-crown w-5"></i> Assinatura</a>
        <a href="#docs" class="sidebar-link flex items-center gap-4 px-6 py-3 text-sm text-gray-400 border-l-[3px] border-transparent" data-route="docs"><i class="fa-solid fa-book w-5"></i> Documentação</a>
      </nav>
      <div class="p-4 border-t border-[#262626]">
        <button onclick="fazerLogout()" class="w-full h-10 rounded-lg bg-[#1a1a1a] border border-[#333] text-gray-400 text-xs font-bold hover:bg-red-600 hover:text-white hover:border-red-600 transition">Sair da Conta</button>
      </div>
    </aside>

    <div class="flex-1 ml-64 flex flex-col">
      <header class="bg-[#0a0a0a]/90 backdrop-blur sticky top-0 z-30 border-b border-[#262626] px-8 py-4 flex items-center justify-between">
        <h1 id="page-title" class="text-xl font-black">Visão Geral</h1>
        <div class="text-xs bg-[#141414] border border-[#262626] px-4 py-2 rounded-xl flex items-center gap-2">
          <i class="fa-solid fa-bolt text-yellow-400"></i> 
          <span class="text-gray-400">Consumo:</span>
          <span id="saldo-text" class="font-bold text-white">--</span>
        </div>
      </header>
      <main id="content" class="flex-1 p-8 overflow-y-auto"></main>
    </div>
  </div>
</div>

<div id="modal-root"></div>

<script>
const state = { cliente:null, plano:null, chaves:[] };
const Toast = {
  show(msg, type='info') {
    const el=document.createElement('div');
    el.className=`fixed bottom-6 right-6 z-50 bg-[#1a1a1a] border-l-4 ${type==='error'?'border-red-500':'border-green-500'} text-white px-6 py-4 rounded-xl shadow-2xl text-sm font-bold`;
    el.textContent=msg; document.body.appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3000);
  }
};
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy = async (txt,msg='Copiado!')=>{try{await navigator.clipboard.writeText(txt);Toast.show(msg)}catch{Toast.show('Erro ao copiar','error')}};

function mostrarInicial() {
  document.getElementById('view-inicial').classList.remove('hidden');
  document.getElementById('view-cadastro').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
}

function mostrarCadastro() {
  document.getElementById('view-inicial').classList.add('hidden');
  document.getElementById('view-cadastro').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('title-form').textContent = 'Criar Conta';
  document.getElementById('form-cadastro').classList.remove('hidden');
  document.getElementById('form-login').classList.add('hidden');
  document.getElementById('btn-alternar').innerHTML = 'Já tem uma conta? <span class="text-red-500 font-bold">Faça login</span>';
}

function alternarForm() {
  const isCadastro = !document.getElementById('form-cadastro').classList.contains('hidden');
  if (isCadastro) {
    document.getElementById('title-form').textContent = 'Fazer Login';
    document.getElementById('form-cadastro').classList.add('hidden');
    document.getElementById('form-login').classList.remove('hidden');
    document.getElementById('btn-alternar').innerHTML = 'Não tem conta? <span class="text-red-500 font-bold">Crie uma agora</span>';
  } else {
    mostrarCadastro();
  }
}

const Api = {
  async req(method, path, body) {
    const opts = { method, credentials:'include' };
    if (body) { opts.headers={'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
    const r = await fetch(path, opts);
    if (r.status === 401 && !path.includes('/auth/login') && !path.includes('/auth/me')) { 
        mostrarInicial(); 
        throw new Error('Sessão expirada'); 
    }
    if (!r.ok) { let d='Erro'; try{ d=(await r.json()).detail }catch{} throw new Error(d); }
    return r.json();
  },
  get(p){ return this.req('GET',p); },
  post(p,b){ return this.req('POST',p,b); },
  del(p){ return this.req('DELETE',p); }
};

async function doLogin(ev){
  ev.preventDefault();
  const btn = document.getElementById('btn-login');
  btn.disabled=true; btn.innerHTML='Entrando...';
  try{
    await Api.post('/v1/auth/login',{ email:document.getElementById('login-email').value, senha:document.getElementById('login-senha').value });
    iniciarPainel();
  }catch(e){ document.getElementById('auth-erro').textContent = e.message; document.getElementById('auth-erro').classList.remove('hidden'); }
  finally{ btn.disabled=false; btn.innerHTML='Entrar na conta'; }
}

async function doCadastro(ev){
  ev.preventDefault();
  const btn = document.getElementById('btn-cadastro');
  btn.disabled=true; btn.innerHTML='Criando conta...';
  try{
    const r = await Api.post('/v1/auth/register',{ nome:document.getElementById('cad-nome').value, email:document.getElementById('cad-email').value, senha:document.getElementById('cad-senha').value });
    
    document.getElementById('modal-root').innerHTML = `
      <div class="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="card w-full max-w-lg p-8 text-center border-green-500/30">
          <div class="w-16 h-16 rounded-full bg-green-500/20 flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-check text-3xl text-green-400"></i></div>
          <h3 class="text-xl font-black mb-1">Conta criada com sucesso!</h3>
          <p class="text-sm text-gray-400 mb-6">Sua API Key inicial foi gerada.</p>
          <div class="key-box text-green-400 mb-4">${esc(r.api_key)}</div>
          <p class="text-xs text-red-400 mb-6 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Copie agora. Não mostraremos de novo!</p>
          <button onclick="copy('${esc(r.api_key)}','Copiado!')" class="w-full h-12 btn-red">Copiar e Acessar Painel</button>
        </div>
      </div>`;
    setTimeout(()=>{ document.getElementById('modal-root').innerHTML=''; iniciarPainel(); }, 5000);
  }catch(e){ document.getElementById('auth-erro').textContent = e.message; document.getElementById('auth-erro').classList.remove('hidden'); }
  finally{ btn.disabled=false; btn.innerHTML='Criar minha conta'; }
}

async function fazerLogout(){ await Api.post('/v1/auth/logout'); mostrarInicial(); }

async function iniciarPainel(){
  try{
    state.cliente = await Api.get('/v1/auth/me');
    state.plano = state.cliente.plano;
    document.getElementById('view-inicial').classList.add('hidden');
    document.getElementById('view-cadastro').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('saldo-text').textContent = `${state.cliente.uso_mes} / ${state.plano.req_mes<0?'∞':state.plano.req_mes}`;
    Router.handle();
  }catch(e){ 
    mostrarInicial(); 
  }
}

const Router = {
  current:'dashboard',
  handle(){
    const h = location.hash.replace('#','')||'dashboard';
    this.current = h;
    document.querySelectorAll('.sidebar-link').forEach(a=>a.classList.toggle('active', a.dataset.route===h));
    const t={dashboard:'Visão Geral',keys:'API Keys',plano:'Assinatura',docs:'Documentação'};
    document.getElementById('page-title').textContent=t[h]||h;
    this.render();
  },
  async render(){
    const c = document.getElementById('content');
    c.innerHTML = '<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-2xl text-red-600"></i></div>';
    try{
      if(this.current==='dashboard') await Views.dashboard(c);
      else if(this.current==='keys') await Views.keys(c);
      else if(this.current==='plano') await Views.plano(c);
      else if(this.current==='docs') await Views.docs(c);
    }catch(e){ c.innerHTML = `<div class="text-red-400 text-center font-bold">Erro: ${e.message}</div>`; }
  }
};

const Views = {
  async dashboard(c){
    const pct = state.plano.req_mes>0 ? Math.min(100,(state.cliente.uso_mes/state.plano.req_mes)*100) : 0;
    c.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="card p-6 relative overflow-hidden"><div class="absolute -right-4 -top-4 w-20 h-20 bg-blue-500 rounded-full blur-[40px] opacity-20"></div><div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Requisições Feitas</div><div class="text-4xl font-black">${state.cliente.uso_mes}</div></div>
        <div class="card p-6 relative overflow-hidden"><div class="absolute -right-4 -top-4 w-20 h-20 bg-purple-500 rounded-full blur-[40px] opacity-20"></div><div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Limite do Plano</div><div class="text-4xl font-black">${state.plano.req_mes<0?'∞':state.plano.req_mes}</div></div>
        <div class="card p-6 relative overflow-hidden border-yellow-500/30"><div class="absolute -right-4 -top-4 w-20 h-20 bg-yellow-500 rounded-full blur-[40px] opacity-20"></div><div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Plano Atual</div><div class="text-3xl font-black text-yellow-400 uppercase">${state.plano.nome}</div><div class="text-xs text-gray-400 mt-1">Expira em ${new Date(state.plano.expira_em).toLocaleDateString()}</div></div>
      </div>
      <div class="card p-6 rounded-2xl">
        <div class="flex justify-between items-center mb-4"><div class="text-sm font-bold text-gray-300">Consumo Mensal</div><div class="text-xs font-bold text-gray-500">${pct.toFixed(1)}%</div></div>
        <div class="h-4 bg-[#1a1a1a] rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-red-600 to-red-400" style="width:${pct}%"></div></div>
      </div>
    `;
  },
  async keys(c){
    const data = await Api.get('/v1/auth/keys');
    c.innerHTML = `
      <div class="flex justify-between items-center mb-8"><div><h2 class="text-xl font-bold">Gerenciar Chaves</h2><p class="text-xs text-gray-500">Use estas chaves para autenticar suas requisições.</p></div><button onclick="Views.novaChave()" class="h-10 px-6 btn-red text-sm"><i class="fa-solid fa-plus mr-2"></i> Nova Chave</button></div>
      <div class="grid gap-4">
        ${data.items.map(k=>`
          <div class="card p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div><div class="text-sm font-bold text-white mb-1">${esc(k.nome)}</div><div class="text-xs text-gray-500 font-mono bg-[#1a1a1a] px-3 py-1 rounded inline-block">${esc(k.prefixo)}••••••••</div></div>
            <div class="flex items-center gap-4">${k.ativa ? `<span class="text-[10px] font-bold bg-green-500/20 text-green-400 px-2 py-1 rounded">ATIVA</span><button onclick="Views.revogar(${k.id})" class="h-8 px-4 rounded-lg bg-red-500/10 text-red-500 text-xs font-bold hover:bg-red-500 hover:text-white transition">Revogar</button>` : `<span class="text-[10px] font-bold bg-gray-500/20 text-gray-400 px-2 py-1 rounded">REVOGADA</span>`}</div>
          </div>
        `).join('')}
      </div>
    `;
  },
  async novaChave(){
    const nome = prompt("Dê um nome para esta chave (ex: Produção, Teste):");
    if(!nome) return;
    const r = await Api.post('/v1/auth/keys',{nome});
    document.getElementById('modal-root').innerHTML = `
      <div class="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="card w-full max-w-lg p-8 text-center"><h3 class="text-xl font-black mb-4">Chave Criada!</h3><div class="key-box text-green-400 mb-6">${esc(r.chave)}</div><button onclick="copy('${esc(r.chave)}','Copiado!')" class="w-full h-12 btn-red">Copiar Chave</button><button onclick="document.getElementById('modal-root').innerHTML='';Router.render()" class="w-full h-12 mt-2 text-gray-400 hover:text-white text-sm">Fechar</button></div>
      </div>`;
  },
  async revogar(id){ if(!confirm('Tem certeza? Isso quebrará qualquer sistema usando esta chave.')) return; await Api.del('/v1/auth/keys/'+id); Toast.show('Chave revogada'); Router.render(); },
  async plano(c){
    const planos = await Api.get('/v1/plans');
    c.innerHTML = `
      <div class="mb-8"><h2 class="text-xl font-bold">Planos Disponíveis</h2><p class="text-xs text-gray-500">Faça upgrade para liberar mais requisições e acesso ao proxy.</p></div>
      <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
        ${planos.items.map(p=>`
          <div class="card p-6 text-center ${p.slug==='pro'?'border-red-600/50 shadow-[0_0_30px_rgba(229,9,20,0.1)]':''}"><div class="text-xs font-bold ${p.slug==='pro'?'text-red-500':'text-gray-400'} uppercase mb-2">${esc(p.nome)}</div><div class="text-4xl font-black mb-4">R$ ${p.preco_mensal}</div><div class="text-xs text-gray-400 mb-6">${p.req_mes<0?'Ilimitado':p.req_mes+' req/mês'}</div><button onclick="Toast.show('Checkout em breve!','info')" class="w-full h-10 rounded-xl border border-[#333] text-xs font-bold hover:bg-[#1a1a1a] transition">Assinar</button></div>
        `).join('')}
      </div>
    `;
  },
  async docs(c){
    const k = state.chaves[0] ? state.chaves[0].prefixo : 'SUA_KEY';
    c.innerHTML = `
      <div class="mb-8"><h2 class="text-xl font-bold">Documentação Rápida</h2><p class="text-xs text-gray-500">Exemplos de como consumir a API.</p></div>
      <div class="space-y-4">
        <div class="card p-6 rounded-2xl"><h3 class="font-bold text-sm mb-4 text-blue-400"><i class="fa-solid fa-code mr-2"></i> Requisição Básica</h3><div class="bg-[#0a0a0a] border border-[#222] p-4 rounded-xl text-xs font-mono text-green-400 overflow-x-auto">curl -H "X-API-Key: vn_live_${k}..." https://api.venusdev.xyz/v1/filmes</div></div>
        <div class="card p-6 rounded-2xl"><h3 class="font-bold text-sm mb-4 text-purple-400"><i class="fa-solid fa-tv mr-2"></i> Playlist M3U (TiviMate/VLC)</h3><div class="bg-[#0a0a0a] border border-[#222] p-4 rounded-xl text-xs font-mono text-green-400 break-all">https://api.venusdev.xyz/v1/playlist.m3u?api_key=vn_live_${k}...</div></div>
