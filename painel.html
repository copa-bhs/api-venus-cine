<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vênus API · Painel do Cliente</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  const firebaseConfig = {
    apiKey: "AIzaSyAvTri3e0L1r5Z60RexRLwdAD9GKD7aYas",
    authDomain: "apivenuscine.firebaseapp.com",
    projectId: "apivenuscine",
    storageBucket: "apivenuscine.firebasestorage.app",
    messagingSenderId: "289112759962",
    appId: "1:289112759962:web:ad2a56c64ff3a8b4f48923",
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  window.loginComGoogle = async function() { try { await signInWithRedirect(auth, provider); } catch (error) { alert(error.message); } };
  window.verificarRetornoGoogle = async function() {
    try {
      const result = await getRedirectResult(auth);
      if (result && result.user) {
        const idToken = await result.user.getIdToken();
        const res = await fetch('/v1/auth/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken }) });
        if (res.ok) { const data = await res.json(); localStorage.setItem('venus_token', data.token); location.reload(); }
      }
    } catch (error) { console.error(error); }
  };
</script>

<style>
  * { box-sizing: border-box; }
  body { background:#0a0a0a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; overflow-x: hidden; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
  .input-dark { width:100%; height:48px; padding:0 16px; background:#141414; border:1px solid #333; border-radius:12px; color:#fff; font-size:14px; outline:none; transition: all .3s; }
  .input-dark:focus { border-color:#E50914; background:#1a1a1a; box-shadow: 0 0 0 3px rgba(229,9,20,0.1); }
  .btn-red { background: linear-gradient(135deg, #E50914 0%, #b80710 100%); transition: all .3s; color:#fff; font-weight:bold; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-red:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(229,9,20,0.3); }
  .card { background: linear-gradient(180deg, #141414 0%, #0f0f0f 100%); border:1px solid #262626; border-radius:20px; transition: all .3s; }
  .card:hover { border-color: #444; }
  .sidebar-link { transition: all .2s; border-left: 3px solid transparent; }
  .sidebar-link.active { background: rgba(229,9,20,0.1); color: #E50914; border-left-color: #E50914; }
  .sidebar-link:hover:not(.active) { background: rgba(255,255,255,0.03); color: #fff; }
  .endpoint-row:hover { background-color: rgba(255,255,255,0.03); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
</style>
</head>
<body>

<!-- TELA DE ENTRADA -->
<div id="view-inicial" class="fixed inset-0 z-50 bg-[#0a0a0a] flex items-center justify-center p-4">
  <div class="card w-full max-w-sm p-8 text-center animate-fade-in-up relative overflow-hidden border-red-600/20 shadow-[0_0_50px_rgba(229,9,20,0.1)]">
    <div class="absolute -top-20 -right-20 w-40 h-40 bg-red-600 rounded-full blur-[80px] opacity-20"></div>
    <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-red-500 to-red-800 flex items-center justify-center mx-auto mb-6 shadow-2xl">
      <span class="text-4xl font-black italic text-white drop-shadow-lg">V</span>
    </div>
    <h1 class="text-2xl font-black mb-2 tracking-tight">Vênus API</h1>
    <p class="text-sm text-gray-400 mb-8">A plataforma definitiva de streaming.</p>

    <div class="space-y-3">
      <!-- BOTÃO DO GOOGLE OCULTO -->
      <button onclick="mostrarCadastro()" class="w-full h-12 btn-red text-sm">
        <i class="fa-solid fa-envelope"></i> Acessar Painel
      </button>
    </div>
    <p class="text-[11px] text-gray-500 mt-6">1.000 requisições grátis por 7 dias.</p>
  </div>
</div>

<!-- TELA DE CADASTRO / LOGIN -->
<div id="view-cadastro" class="hidden fixed inset-0 z-50 bg-[#0a0a0a] flex items-center justify-center p-4">
  <div class="card w-full max-w-sm p-6 relative animate-fade-in-up">
    <button onclick="mostrarInicial()" class="absolute top-4 left-4 w-8 h-8 rounded-full bg-[#1a1a1a] flex items-center justify-center text-gray-400 hover:text-white transition"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="text-center mt-4 mb-6">
      <h2 id="title-form" class="text-xl font-black">Criar Conta</h2>
      <p class="text-xs text-gray-500 mt-1">Preencha seus dados</p>
    </div>
    <div id="auth-erro" class="hidden mb-4 text-xs text-red-400 bg-red-600/10 border border-red-600/30 rounded-lg p-2 text-center font-bold"></div>
    
    <form id="form-cadastro" onsubmit="doCadastro(event)" class="space-y-3">
      <input id="cad-nome" type="text" class="input-dark" required placeholder="Nome completo">
      <input id="cad-email" type="email" class="input-dark" required placeholder="E-mail">
      <input id="cad-senha" type="password" class="input-dark" required minlength="6" placeholder="Senha (mín. 6 caracteres)">
      <button type="submit" id="btn-cadastro" class="w-full h-12 btn-red mt-4">Criar conta grátis</button>
    </form>
    <form id="form-login" onsubmit="doLogin(event)" class="space-y-3 hidden">
      <input id="login-email" type="email" class="input-dark" required placeholder="E-mail">
      <input id="login-senha" type="password" class="input-dark" required placeholder="Senha">
      <button type="submit" id="btn-login" class="w-full h-12 btn-red mt-4">Entrar</button>
    </form>
    <div class="text-center mt-6">
      <button onclick="alternarForm()" id="btn-alternar" class="text-xs text-gray-400 hover:text-white transition">Já tem uma conta? <span class="text-red-500 font-bold">Faça login</span></button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden min-h-screen flex">
  <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden backdrop-blur-sm transition-opacity"></div>
  
  <aside id="sidebar" class="w-64 bg-[#0f0f0f] border-r border-[#262626] flex flex-col fixed inset-y-0 left-0 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
    <div class="p-6 border-b border-[#262626] flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl font-black italic text-red-600">V</span>
        <div><div class="text-sm font-bold text-white">Vênus API</div><div class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Cliente</div></div>
      </div>
      <button onclick="toggleSidebar()" class="lg:hidden text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <nav class="flex-1 py-6 space-y-1 overflow-y-auto">
      <a href="#dashboard" class="sidebar-link flex items-center gap-4 px-6 py-3 text-sm text-gray-400 font-medium" data-route="dashboard"><i class="fa-solid fa-chart-pie w-5"></i> Visão Geral</a>
      <a href="#keys" class="sidebar-link flex items-center gap-4 px-6 py-3 text-sm text-gray-400 font-medium" data-route="keys"><i class="fa-solid fa-key w-5"></i> Minhas API Keys</a>
      <a href="#plano" class="sidebar-link flex items-center gap-4 px-6 py-3 text-sm text-gray-400 font-medium" data-route="plano"><i class="fa-solid fa-crown w-5"></i> Assinatura</a>
      <a href="#docs" class="sidebar-link flex items-center gap-4 px-6 py-3 text-sm text-gray-400 font-medium" data-route="docs"><i class="fa-solid fa-book w-5"></i> Documentação</a>
    </nav>
    <div class="p-4 border-t border-[#262626]">
      <button onclick="fazerLogout()" class="w-full h-10 rounded-xl bg-[#1a1a1a] border border-[#333] text-gray-400 text-xs font-bold hover:bg-red-600 hover:text-white hover:border-red-600 transition-all">Sair da Conta</button>
    </div>
  </aside>

  <div class="flex-1 lg:ml-64 flex flex-col w-full min-h-screen">
    <header class="bg-[#0a0a0a]/90 backdrop-blur-md sticky top-0 z-30 border-b border-[#262626] px-4 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 rounded-xl bg-[#141414] border border-[#262626] flex items-center justify-center text-white"><i class="fa-solid fa-bars"></i></button>
        <h1 id="page-title" class="text-lg lg:text-xl font-black tracking-tight">Visão Geral</h1>
      </div>
      <div class="text-xs bg-[#141414] border border-[#262626] px-3 py-2 rounded-xl flex items-center gap-2 shadow-lg">
        <i class="fa-solid fa-bolt text-yellow-400"></i> 
        <span class="text-gray-400 hidden sm:inline">Consumo:</span>
        <span id="saldo-text" class="font-bold text-white">--</span>
      </div>
    </header>
    <main id="content" class="flex-1 p-4 lg:p-8 w-full max-w-7xl mx-auto overflow-x-hidden"></main>
  </div>
</div>

<div id="modal-root"></div>

<script>
const state = { cliente:null, plano:null, chaves:[] };
const Toast = {
  show(msg, type='info') {
    const el=document.createElement('div');
    el.className=`fixed bottom-6 right-6 z-[100] bg-[#141414] border-l-4 ${type==='error'?'border-red-500':'border-green-500'} text-white px-6 py-4 rounded-xl shadow-2xl text-sm font-bold animate-fade-in-up`;
    el.textContent=msg; document.body.appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3000);
  }
};
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy = async (txt,msg='Copiado!')=>{try{await navigator.clipboard.writeText(txt);Toast.show(msg)}catch{Toast.show('Erro ao copiar','error')}};

function toggleSidebar() {
  const sb = document.getElementById('sidebar'); const ov = document.getElementById('sidebar-overlay');
  if(sb.classList.contains('-translate-x-full')) { sb.classList.remove('-translate-x-full'); ov.classList.remove('hidden'); } 
  else { sb.classList.add('-translate-x-full'); ov.classList.add('hidden'); }
}

function mostrarInicial() { document.getElementById('view-inicial').classList.remove('hidden'); document.getElementById('view-cadastro').classList.add('hidden'); document.getElementById('app').classList.add('hidden'); }
function mostrarCadastro() {
  document.getElementById('view-inicial').classList.add('hidden'); document.getElementById('view-cadastro').classList.remove('hidden'); document.getElementById('app').classList.add('hidden');
  document.getElementById('title-form').textContent = 'Criar Conta';
  document.getElementById('form-cadastro').classList.remove('hidden'); document.getElementById('form-login').classList.add('hidden');
  document.getElementById('btn-alternar').innerHTML = 'Já tem uma conta? <span class="text-red-500 font-bold">Faça login</span>';
}
function alternarForm() {
  const isCadastro = !document.getElementById('form-cadastro').classList.contains('hidden');
  if (isCadastro) {
    document.getElementById('title-form').textContent = 'Fazer Login';
    document.getElementById('form-cadastro').classList.add('hidden'); document.getElementById('form-login').classList.remove('hidden');
    document.getElementById('btn-alternar').innerHTML = 'Não tem conta? <span class="text-red-500 font-bold">Crie uma agora</span>';
  } else { mostrarCadastro(); }
}

const Api = {
  async req(method, path, body) {
    const opts = { method, credentials:'include', headers: {} };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const token = localStorage.getItem('venus_token');
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;

    const r = await fetch(path, opts);
    if (r.status === 401 && !path.includes('/auth/login') && !path.includes('/auth/me')) { localStorage.removeItem('venus_token'); mostrarInicial(); throw new Error('Sessão expirada'); }
    if (!r.ok) { let d = 'Erro no servidor'; try { const j = await r.json(); d = j.detail || j.message || d; } catch { d = 'Erro ' + r.status; } throw new Error(d); }
    return r.json();
  },
  get(p){ return this.req('GET',p); }, post(p,b){ return this.req('POST',p,b); }, del(p){ return this.req('DELETE',p); }
};

async function doLogin(ev){
  ev.preventDefault(); const btn = document.getElementById('btn-login'); btn.disabled=true; btn.innerHTML='Entrando...';
  try{
    const r = await Api.post('/v1/auth/login',{ email:document.getElementById('login-email').value, senha:document.getElementById('login-senha').value });
    localStorage.setItem('venus_token', r.token); iniciarPainel();
  }catch(e){ document.getElementById('auth-erro').textContent = e.message; document.getElementById('auth-erro').classList.remove('hidden'); }
  finally{ btn.disabled=false; btn.innerHTML='Entrar'; }
}

async function doCadastro(ev){
  ev.preventDefault(); const btn = document.getElementById('btn-cadastro'); btn.disabled=true; btn.innerHTML='Criando...';
  try{
    const r = await Api.post('/v1/auth/register',{ nome:document.getElementById('cad-nome').value, email:document.getElementById('cad-email').value, senha:document.getElementById('cad-senha').value });
    localStorage.setItem('venus_token', r.token);
    document.getElementById('modal-root').innerHTML = `
      <div class="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in-up">
        <div class="card w-full max-w-lg p-8 text-center border-green-500/30">
          <div class="w-16 h-16 rounded-full bg-green-500/20 flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-check text-3xl text-green-400"></i></div>
          <h3 class="text-xl font-black mb-1">Conta criada!</h3>
          <p class="text-sm text-gray-400 mb-6">Sua chave de API inicial foi gerada.</p>
          <div class="bg-[#0a0a0a] border border-[#333] rounded-xl p-4 mb-4 font-mono text-green-400 break-all text-sm">${esc(r.api_key)}</div>
          <p class="text-xs text-red-400 mb-6 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Copie agora. Não mostraremos de novo!</p>
          <button onclick="copy('${esc(r.api_key)}','Chave copiada!')" class="w-full h-12 btn-red">Copiar e Acessar</button>
        </div>
      </div>`;
    setTimeout(()=>{ document.getElementById('modal-root').innerHTML=''; iniciarPainel(); }, 6000);
  }catch(e){ document.getElementById('auth-erro').textContent = e.message; document.getElementById('auth-erro').classList.remove('hidden'); }
  finally{ btn.disabled=false; btn.innerHTML='Criar conta grátis'; }
}

async function fazerLogout(){ localStorage.removeItem('venus_token'); await Api.post('/v1/auth/logout'); mostrarInicial(); }

async function iniciarPainel(){
  try{
    state.cliente = await Api.get('/v1/auth/me');
    state.plano = state.cliente.plano;
    document.getElementById('view-inicial').classList.add('hidden');
    document.getElementById('view-cadastro').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('saldo-text').textContent = `${state.cliente.uso_mes} / ${state.plano.req_mes<0?'∞':state.plano.req_mes}`;
    
    const ks = await Api.get('/v1/auth/keys');
    state.chaves = ks.items || [];
    Router.handle();
  }catch(e){ mostrarInicial(); }
}

const Router = {
  current:'dashboard',
  handle(){
    const h = location.hash.replace('#','')||'dashboard';
    this.current = h;
    document.querySelectorAll('.sidebar-link').forEach(a=>a.classList.toggle('active', a.dataset.route===h));
    const t={dashboard:'Visão Geral',keys:'API Keys',plano:'Assinatura',docs:'Documentação'};
    document.getElementById('page-title').textContent=t[h]||h;
    this.render();
    if(window.innerWidth < 1024) { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.add('hidden'); }
  },
  async render(){
    const c = document.getElementById('content');
    c.innerHTML = '<div class="flex justify-center py-20"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-red-600"></i></div>';
    try{
      if(this.current==='dashboard') await Views.dashboard(c);
      else if(this.current==='keys') await Views.keys(c);
      else if(this.current==='plano') await Views.plano(c);
      else if(this.current==='docs') await Views.docs(c);
    }catch(e){ c.innerHTML = `<div class="bg-red-500/10 border border-red-500/50 p-4 rounded-xl text-red-400 font-bold text-center">Erro: ${e.message}</div>`; }
  }
};

const Views = {
  async dashboard(c){
    const pct = state.plano.req_mes>0 ? Math.min(100,(state.cliente.uso_mes/state.plano.req_mes)*100) : 0;
    const primeiroNome = state.cliente.nome.split(' ')[0];
    c.innerHTML = `
      <div class="animate-fade-in-up">
        <h2 class="text-2xl font-black mb-1">Olá, ${esc(primeiroNome)} 👋</h2>
        <p class="text-sm text-gray-400 mb-8">Bem-vindo(a) de volta ao seu painel.</p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-6 mb-8">
          <div class="card p-6 relative overflow-hidden group">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-500 rounded-full blur-[40px] opacity-20 group-hover:opacity-40 transition-opacity"></div>
            <div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400"><i class="fa-solid fa-bolt"></i></div><div class="text-xs font-bold text-gray-400 uppercase tracking-widest">Requisições</div></div>
            <div class="text-4xl font-black">${state.cliente.uso_mes}</div>
            <div class="text-xs text-gray-500 mt-2">Chamadas feitas neste mês</div>
          </div>
          <div class="card p-6 relative overflow-hidden group">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-purple-500 rounded-full blur-[40px] opacity-20 group-hover:opacity-40 transition-opacity"></div>
            <div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-xl bg-purple-500/20 flex items-center justify-center text-purple-400"><i class="fa-solid fa-gauge-high"></i></div><div class="text-xs font-bold text-gray-400 uppercase tracking-widest">Limite</div></div>
            <div class="text-4xl font-black">${state.plano.req_mes<0?'∞':state.plano.req_mes}</div>
            <div class="text-xs text-gray-500 mt-2">Cota do plano ${state.plano.nome}</div>
          </div>
          <div class="card card-highlight p-6 relative overflow-hidden group">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-yellow-500 rounded-full blur-[40px] opacity-20 group-hover:opacity-40 transition-opacity"></div>
            <div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-xl bg-yellow-500/20 flex items-center justify-center text-yellow-400"><i class="fa-solid fa-crown"></i></div><div class="text-xs font-bold text-gray-400 uppercase tracking-widest">Plano Atual</div></div>
            <div class="text-3xl font-black text-yellow-400 uppercase">${state.plano.nome}</div>
            <div class="text-xs text-gray-400 mt-2">Renova em ${new Date(state.plano.expira_em).toLocaleDateString('pt-BR')}</div>
          </div>
        </div>
        <div class="card p-6 lg:p-8">
          <div class="flex justify-between items-center mb-4"><div class="font-bold text-white">Consumo de Requisições</div><div class="text-sm font-black text-gray-400">${pct.toFixed(1)}%</div></div>
          <div class="h-4 bg-[#1a1a1a] rounded-full overflow-hidden shadow-inner"><div class="h-full bg-gradient-to-r from-red-600 to-red-400 relative" style="width:${pct}%"><div class="absolute inset-0 bg-white/20 w-full h-full animate-pulse"></div></div></div>
        </div>
      </div>`;
  },

  async keys(c){
    c.innerHTML = `
      <div class="animate-fade-in-up">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
          <div><h2 class="text-2xl font-black">Minhas API Keys</h2><p class="text-xs text-gray-400 mt-1">Use estas chaves para autenticar seu sistema.</p></div>
          <button onclick="Views.novaChave()" class="h-11 px-6 btn-red text-sm whitespace-nowrap"><i class="fa-solid fa-plus"></i> Gerar Nova Chave</button>
        </div>
        <div class="grid gap-4">
          ${state.chaves.length === 0 ? '<div class="text-center py-10 text-gray-500">Nenhuma chave encontrada.</div>' : 
          state.chaves.map(k=>`
            <div class="card p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <div class="text-sm font-bold text-white">${esc(k.nome)}</div>
                  ${k.ativa ? '<span class="text-[9px] font-bold bg-green-500/20 text-green-400 px-2 py-0.5 rounded">ATIVA</span>' : ''}
                </div>
                <div class="text-xs text-gray-500 font-mono bg-[#0a0a0a] border border-[#222] px-3 py-1.5 rounded-lg inline-block">${esc(k.prefixo)}••••••••</div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="Views.deletar(${k.id})" class="h-9 px-4 rounded-lg bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white text-xs font-bold transition flex items-center gap-2"><i class="fa-solid fa-trash"></i> Excluir</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  },
  
  async novaChave(){
    document.getElementById('modal-root').innerHTML = `
      <div class="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in-up">
        <div class="card w-full max-w-sm p-6 border-[#333]">
          <h3 class="text-lg font-black mb-1">Criar Nova Chave</h3>
          <p class="text-xs text-gray-400 mb-4">Dê um nome para identificar onde vai usar.</p>
          <input id="nova-chave-nome" class="input-dark mb-4" placeholder="Ex: Produção, App Mobile, Teste" autofocus>
          <div class="flex gap-2">
            <button onclick="document.getElementById('modal-root').innerHTML=''" class="flex-1 h-11 rounded-xl bg-[#1a1a1a] text-xs font-bold text-gray-400 hover:text-white transition">Cancelar</button>
            <button onclick="Views.salvarNovaChave()" class="flex-1 h-11 btn-red text-xs">Gerar Chave</button>
          </div>
        </div>
      </div>`;
  },

  async salvarNovaChave(){
    const nome = document.getElementById('nova-chave-nome').value.trim();
    if(!nome) return Toast.show('Digite um nome', 'error');
    try {
      const r = await Api.post('/v1/auth/keys',{nome});
      document.getElementById('modal-root').innerHTML = `
        <div class="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in-up">
          <div class="card w-full max-w-lg p-8 text-center border-green-500/30">
            <h3 class="text-xl font-black mb-2">Chave Criada!</h3>
            <p class="text-xs text-red-400 mb-6 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Copie agora. Não mostraremos de novo.</p>
            <div class="bg-[#0a0a0a] border border-[#333] rounded-xl p-4 mb-6 font-mono text-green-400 break-all text-sm">${esc(r.chave)}</div>
            <button onclick="copy('${esc(r.chave)}','Copiado!')" class="w-full h-12 btn-red">Copiar Chave</button>
            <button onclick="document.getElementById('modal-root').innerHTML='';iniciarPainel()" class="w-full h-12 mt-2 text-gray-400 hover:text-white text-sm font-bold transition">Fechar</button>
          </div>
        </div>`;
    } catch(e) { Toast.show(e.message, 'error'); }
  },

  async deletar(id){ 
    if(!confirm('⚠️ Tem certeza que deseja EXCLUIR esta chave? Qualquer sistema que a use vai parar de funcionar imediatamente.')) return; 
    try {
      await Api.del('/v1/auth/keys/'+id); 
      Toast.show('Chave excluída com sucesso!'); 
      iniciarPainel();
    } catch(e) { Toast.show(e.message, 'error'); }
  },

  async plano(c){
    const planos = await Api.get('/v1/plans');
    c.innerHTML = `
      <div class="animate-fade-in-up">
        <div class="mb-8"><h2 class="text-2xl font-black">Assinatura</h2><p class="text-xs text-gray-400 mt-1">Faça upgrade para liberar mais requisições e acesso ao proxy.</p></div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          ${planos.items.map(p=>{
            const isAtual = p.slug === state.plano.slug; const destaque = p.slug === 'pro';
            return `
            <div class="card ${destaque?'card-highlight':''} p-6 flex flex-col text-center relative overflow-hidden group">
              ${destaque?'<div class="absolute top-0 left-0 w-full h-1 bg-red-600"></div>':''}
              <div class="text-xs font-bold ${destaque?'text-red-500':'text-gray-400'} uppercase tracking-widest mb-2">${esc(p.nome)}</div>
              <div class="text-4xl font-black mb-4">R$ ${p.preco_mensal}</div>
              <ul class="text-xs text-gray-400 space-y-3 mb-8 flex-1 text-left">
                <li><i class="fa-solid fa-check text-green-500 mr-2"></i> ${p.req_mes<0?'Ilimitado':p.req_mes.toLocaleString('pt-BR')+' req/mês'}</li>
                <li><i class="fa-solid fa-check text-green-500 mr-2"></i> ${p.req_por_segundo} req/segundo</li>
                <li><i class="fa-solid ${p.proxy_habilitado?'fa-check text-green-500':'fa-xmark text-gray-600'} mr-2"></i> Proxy de Stream</li>
              </ul>
              ${isAtual ? `<button disabled class="w-full h-11 rounded-xl bg-[#222] text-gray-500 text-xs font-bold cursor-not-allowed">Seu Plano Atual</button>` : `<button onclick="Toast.show('Checkout em breve!','info')" class="w-full h-11 rounded-xl border border-[#333] text-xs font-bold hover:bg-[#1a1a1a] transition">Fazer Upgrade</button>`}
            </div>`}).join('')}
        </div>
      </div>`;
  },

  async docs(c){
    const chaveAtiva = state.chaves.find(k => k.ativa);
    const chaveExemplo = chaveAtiva ? chaveAtiva.prefixo + 'xxxxxxx' : 'vn_live_SUA_CHAVE_AQUI';
    const base = location.origin;
    
    c.innerHTML = `
      <div class="animate-fade-in-up">
        <div class="mb-8">
          <h2 class="text-2xl font-black">Documentação</h2>
          <p class="text-xs text-gray-400 mt-1">Aprenda a integrar o Vênus API no seu aplicativo de forma simples.</p>
        </div>

        <div class="grid lg:grid-cols-2 gap-6 mb-8">
          <!-- Passo 1: Autenticação -->
          <div class="card p-6 border-blue-500/20">
            <h3 class="font-bold text-blue-400 mb-4 flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> 1. Como Autenticar</h3>
            <p class="text-sm text-gray-400 mb-4">Todas as requisições precisam da sua API Key.</p>
            
            <div class="text-xs font-bold text-gray-500 mb-2 uppercase">Header (Para programação)</div>
            <div class="flex items-center gap-2 bg-[#0a0a0a] border border-[#222] p-3 rounded-xl mb-4">
              <code class="text-xs font-mono text-gray-300 flex-1 overflow-x-auto"><span class="text-blue-400">X-API-Key:</span> ${esc(chaveExemplo)}</code>
              <button onclick="copy('${esc(chaveExemplo)}')" class="text-gray-500 hover:text-white px-2"><i class="fa-regular fa-copy"></i></button>
            </div>

            <div class="text-xs font-bold text-gray-500 mb-2 uppercase">Query Param (Para players e navegador)</div>
            <div class="flex items-center gap-2 bg-[#0a0a0a] border border-[#222] p-3 rounded-xl">
              <code class="text-xs font-mono text-gray-300 flex-1 overflow-x-auto"><span class="text-yellow-400">?api_key=</span>${esc(chaveExemplo)}</code>
              <button onclick="copy('?api_key=${esc(chaveExemplo)}')" class="text-gray-500 hover:text-white px-2"><i class="fa-regular fa-copy"></i></button>
            </div>
          </div>

          <!-- Passo 2: Playlist M3U -->
          <div class="card p-6 border-purple-500/20">
            <h3 class="font-bold text-purple-400 mb-4 flex items-center gap-2"><i class="fa-solid fa-tv"></i> 2. Playlist M3U (TV)</h3>
            <p class="text-sm text-gray-400 mb-4">Cole no TiviMate, IPTV Smarters ou VLC:</p>
            <div class="flex items-center gap-2 bg-[#0a0a0a] border border-[#222] p-3 rounded-xl mb-4">
              <code class="text-xs font-mono text-green-400 flex-1 overflow-x-auto break-all">${esc(base)}/v1/playlist.m3u?api_key=${esc(chaveExemplo)}</code>
              <button onclick="copy('${esc(base)}/v1/playlist.m3u?api_key=${esc(chaveExemplo)}')" class="text-gray-500 hover:text-white px-2"><i class="fa-regular fa-copy"></i></button>
            </div>
          </div>
        </div>

        <!-- Passo 3: Endpoints (LISTA COMPLETA) -->
        <div class="card p-6 mb-8">
          <h3 class="font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-code text-gray-400"></i> 3. Lista de Conteúdo (Endpoints)</h3>
          <p class="text-sm text-gray-400 mb-4">Use estas rotas para puxar os dados em formato JSON no seu sistema:</p>
          
          <div class="space-y-1">
            ${[
              ['Listar Filmes', '/v1/filmes?page=1', 'Mostra os filmes paginados'],
              ['Listar Séries', '/v1/series?page=1', 'Mostra as séries paginadas'],
              ['Listar Canais', '/v1/canais?page=1', 'Mostra os canais paginados'],
              ['Buscar Título', '/v1/buscar?q=vingadores', 'Pesquisa em todo o catálogo'],
              ['Categorias', '/v1/categorias', 'Lista todas as categorias (Ação, Comédia...)'],
              ['Filtrar por Categoria', '/v1/filmes?categoria=Ação', 'Ex: ver só filmes de Ação'],
              ['Detalhes do Filme', '/v1/info/filme/2127', 'Sinopse, capa, trailer, elenco'],
              ['Detalhes da Série', '/v1/info/serie/4521', 'Episódios e temporadas'],
              ['Stream de Vídeo', '/v1/stream/homem-aranha-2017', 'Link direto para o player (.mp4)']
            ].map(([titulo, rota, desc])=>`
              <div class="endpoint-row flex flex-col sm:flex-row sm:items-center justify-between p-3 border-b border-[#222] rounded-lg transition">
                <div class="mb-2 sm:mb-0">
                  <div class="text-sm text-gray-200 font-bold">${titulo}</div>
                  <div class="text-xs text-gray-500">${desc}</div>
                </div>
                <div class="flex items-center gap-2 bg-[#0a0a0a] border border-[#222] px-3 py-2 rounded-lg">
                  <code class="text-xs font-mono text-green-400 flex-1 sm:flex-none">${rota}</code>
                  <button onclick="copy('${esc(base)}${rota}')" class="text-gray-500 hover:text-white"><i class="fa-regular fa-copy"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Passo 4: Exemplos Práticos -->
        <div class="card p-6 border-yellow-500/20">
          <h3 class="font-bold text-yellow-400 mb-2 flex items-center gap-2"><i class="fa-solid fa-terminal"></i> 4. Exemplos Práticos</h3>
          <p class="text-sm text-gray-400 mb-4">Se você for testar no navegador ou no Postman, a URL completa fica assim:</p>
          
          <div class="text-xs font-bold text-gray-500 mb-1 uppercase">Exemplo: Listar Filmes</div>
          <div class="flex items-center gap-2 bg-[#0a0a0a] border border-[#222] p-3 rounded-xl mb-4">
            <code class="text-xs font-mono text-green-400 flex-1 overflow-x-auto break-all">${esc(base)}/v1/filmes?page=1&api_key=${esc(chaveExemplo)}</code>
            <button onclick="copy('${esc(base)}/v1/filmes?page=1&api_key=${esc(chaveExemplo)}')" class="text-gray-500 hover:text-white px-2"><i class="fa-regular fa-copy"></i></button>
          </div>

          <div class="text-xs font-bold text-gray-500 mb-1 uppercase">Exemplo: Buscar Vingadores</div>
          <div class="flex items-center gap-2 bg-[#0a0a0a] border border-[#222] p-3 rounded-xl mb-4">
            <code class="text-xs font-mono text-green-400 flex-1 overflow-x-auto break-all">${esc(base)}/v1/buscar?q=vingadores&api_key=${esc(chaveExemplo)}</code>
            <button onclick="copy('${esc(base)}/v1/buscar?q=vingadores&api_key=${esc(chaveExemplo)}')" class="text-gray-500 hover:text-white px-2"><i class="fa-regular fa-copy"></i></button>
          </div>

          <p class="text-xs text-yellow-500 font-bold mt-2">Dica: O "page=1" significa que é a página 1. Se quiser ver mais itens, mude para page=2, page=3, etc.</p>
        </div>
      </div>
    `;
  }
};

window.addEventListener('hashchange', ()=>Router.handle());
window.addEventListener('DOMContentLoaded', ()=>{ verificarRetornoGoogle(); iniciarPainel(); });
</script>
</body>
</html>
